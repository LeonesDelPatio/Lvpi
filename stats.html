<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Estadísticas · Leones del Patio</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #0b0b0b;
      color: #f2f2f2;
      font-family: Arial, Helvetica, sans-serif;
    }

    .container {
      width: min(1100px, 92%);
      margin: 0 auto;
      padding: 50px 0 70px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 32px;
      font-weight: 600;
    }

    .subtitle {
      margin: 0 0 40px;
      color: #888;
      font-size: 14px;
    }

    /* LOGIN */

    #login-section {
      max-width: 420px;
      margin: 80px auto;
    }

    #login-section h1 {
      margin-bottom: 10px;
    }

    .login-box {
      margin-top: 30px;
      padding: 28px;
      background: #151515;
      border: 1px solid #292929;
      border-radius: 8px;
    }

    input {
      width: 100%;
      padding: 13px 14px;
      margin-bottom: 14px;

      background: #0d0d0d;
      color: #fff;

      border: 1px solid #333;
      border-radius: 5px;

      font-size: 14px;
      outline: none;
    }

    input:focus {
      border-color: #666;
    }

    button {
      border: 0;
      border-radius: 5px;

      padding: 12px 18px;

      background: #f2f2f2;
      color: #111;

      font-size: 14px;
      font-weight: 600;

      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    .error {
      margin-top: 15px;
      color: #e57373;
      font-size: 14px;
      line-height: 1.5;
    }

    /* STATS */

    #stats-section {
      display: none;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;

      gap: 20px;
      margin-bottom: 40px;
    }

    .top-bar button {
      background: transparent;
      color: #aaa;
      border: 1px solid #333;
    }

    .top-bar button:hover {
      color: #fff;
      border-color: #666;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;

      margin-bottom: 50px;
    }

    .summary-card {
      background: #151515;
      border: 1px solid #292929;
      border-radius: 8px;

      padding: 28px;
    }

    .summary-label {
      color: #888;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 12px;
    }

    .summary-value {
      font-size: 38px;
      font-weight: 600;
    }

    .albums-title {
      margin-bottom: 20px;
      font-size: 20px;
      font-weight: 600;
    }

    .album {
      margin-bottom: 18px;

      background: #151515;
      border: 1px solid #292929;
      border-radius: 8px;

      overflow: hidden;
    }

    .album-header {
      display: flex;
      justify-content: space-between;
      align-items: center;

      gap: 20px;
      padding: 20px 22px;

      border-bottom: 1px solid #292929;
    }

    .album-name {
      font-size: 16px;
      font-weight: 600;
    }

    .album-total {
      color: #aaa;
      font-size: 14px;
      white-space: nowrap;
    }

    .songs {
      padding: 0 22px;
    }

    .song {
      display: flex;
      justify-content: space-between;
      align-items: center;

      gap: 20px;

      padding: 13px 0;

      border-bottom: 1px solid #222;
    }

    .song:last-child {
      border-bottom: 0;
    }

    .song-name {
      color: #ccc;
      font-size: 14px;
      line-height: 1.4;
    }

    .song-plays {
      color: #888;
      font-size: 13px;
      white-space: nowrap;
    }

    .empty {
      padding: 30px;
      text-align: center;
      color: #777;

      background: #151515;
      border: 1px solid #292929;
      border-radius: 8px;
    }

    .loading {
      color: #888;
      font-size: 14px;
    }

    @media (max-width: 650px) {

      .container {
        padding-top: 30px;
      }

      .summary {
        grid-template-columns: 1fr;
      }

      .top-bar {
        align-items: flex-start;
      }

      .album-header,
      .song {
        align-items: flex-start;
      }

      .album-header {
        flex-direction: column;
        gap: 8px;
      }

      .song {
        flex-direction: column;
        gap: 5px;
      }

      .summary-value {
        font-size: 32px;
      }
    }
  </style>
</head>

<body>

  <!-- ============================= -->
  <!-- LOGIN -->
  <!-- ============================= -->

  <section id="login-section">

    <div class="container">

      <h1>Estadísticas</h1>

      <p class="subtitle">
        Panel privado · Leones del Patio
      </p>

      <div class="login-box">

        <input
          type="email"
          id="email"
          placeholder="Correo electrónico"
          autocomplete="email"
        >

        <input
          type="password"
          id="password"
          placeholder="Contraseña"
          autocomplete="current-password"
        >

        <button onclick="iniciarSesion()">
          Iniciar sesión
        </button>

        <div
          id="login-error"
          class="error"
        ></div>

      </div>

    </div>

  </section>


  <!-- ============================= -->
  <!-- ESTADÍSTICAS -->
  <!-- ============================= -->

  <section id="stats-section">

    <div class="container">

      <div class="top-bar">

        <div>
          <h1>Estadísticas</h1>

          <p class="subtitle">
            Leones del Patio
          </p>
        </div>

        <button onclick="cerrarSesion()">
          Cerrar sesión
        </button>

      </div>


      <!-- RESUMEN -->

      <div class="summary">

        <div class="summary-card">

          <div class="summary-label">
            Visitas
          </div>

          <div
            id="total-visits"
            class="summary-value"
          >
            —
          </div>

        </div>


        <div class="summary-card">

          <div class="summary-label">
            Reproducciones
          </div>

          <div
            id="total-plays"
            class="summary-value"
          >
            —
          </div>

        </div>

      </div>


      <!-- ÁLBUMES -->

      <div class="albums-title">
        Álbumes
      </div>

      <div id="albums-container">

        <div class="loading">
          Cargando estadísticas...
        </div>

      </div>

    </div>

  </section>


  <!-- SUPABASE -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


  <script>

    const SUPABASE_URL =
      "https://cavnifartuktwmchyrdl.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_WC_7KWhh6gq-pvL-97D3VA_78DyHmOM";


    const client =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
      );


    // ==================================
    // INICIAR SESIÓN
    // ==================================

    async function iniciarSesion() {

      const email =
        document.getElementById("email").value.trim();

      const password =
        document.getElementById("password").value;

      const errorElement =
        document.getElementById("login-error");

      errorElement.textContent = "";


      if (!email || !password) {

        errorElement.textContent =
          "Introduce el correo y la contraseña.";

        return;
      }


      const { data, error } =
        await client.auth.signInWithPassword({
          email,
          password
        });


      if (error) {

        errorElement.textContent =
          "No se pudo iniciar sesión: " +
          error.message;

        return;
      }


      if (!data.session) {

        errorElement.textContent =
          "No se pudo establecer la sesión.";

        return;
      }


      document.getElementById(
        "login-section"
      ).style.display = "none";


      document.getElementById(
        "stats-section"
      ).style.display = "block";


      cargarEstadisticas();
    }


    // ==================================
    // CARGAR ESTADÍSTICAS
    // ==================================

    async function cargarEstadisticas() {

      const container =
        document.getElementById(
          "albums-container"
        );


      container.innerHTML =
        '<div class="loading">Cargando estadísticas...</div>';


      const {
        data,
        error
      } =
        await client.functions.invoke(
          "get-stats",
          {
            body: {}
          }
        );


      if (error) {

        console.error(
          "Error get-stats:",
          error
        );

        container.innerHTML =
          '<div class="error">No se pudieron cargar las estadísticas.</div>';

        return;
      }


      if (!data) {

        container.innerHTML =
          '<div class="error">No se recibieron datos.</div>';

        return;
      }


      // TOTAL VISITAS

      document.getElementById(
        "total-visits"
      ).textContent =
        data.visits ?? 0;


      // TOTAL REPRODUCCIONES

      document.getElementById(
        "total-plays"
      ).textContent =
        data.total ?? 0;


      // ÁLBUMES

      if (
        !data.albums ||
        data.albums.length === 0
      ) {

        container.innerHTML =
          '<div class="empty">Todavía no hay reproducciones.</div>';

        return;
      }


      container.innerHTML = "";


      for (const album of data.albums) {

        const albumElement =
          document.createElement("div");

        albumElement.className =
          "album";


        // CABECERA DEL ÁLBUM

        const header =
          document.createElement("div");

        header.className =
          "album-header";


        const name =
          document.createElement("div");

        name.className =
          "album-name";

        name.textContent =
          album.album;


        const total =
          document.createElement("div");

        total.className =
          "album-total";

        total.textContent =
          `${album.total} reproducciones`;


        header.appendChild(name);
        header.appendChild(total);


        // CANCIONES

        const songsContainer =
          document.createElement("div");

        songsContainer.className =
          "songs";


        for (const song of album.songs) {

          const songElement =
            document.createElement("div");

          songElement.className =
            "song";


          const songName =
            document.createElement("div");

          songName.className =
            "song-name";

          songName.textContent =
            song.song;


          const songPlays =
            document.createElement("div");

          songPlays.className =
            "song-plays";

          songPlays.textContent =
            `${song.plays} reproducciones`;


          songElement.appendChild(
            songName
          );

          songElement.appendChild(
            songPlays
          );


          songsContainer.appendChild(
            songElement
          );
        }


        albumElement.appendChild(
          header
        );

        albumElement.appendChild(
          songsContainer
        );


        container.appendChild(
          albumElement
        );
      }
    }


    // ==================================
    // CERRAR SESIÓN
    // ==================================

    async function cerrarSesion() {

      await client.auth.signOut();

      document.getElementById(
        "stats-section"
      ).style.display = "none";


      document.getElementById(
        "login-section"
      ).style.display = "block";


      document.getElementById(
        "password"
      ).value = "";
    }


    // ==================================
    // ENTER PARA INICIAR SESIÓN
    // ==================================

    document
      .getElementById("password")
      .addEventListener(
        "keydown",
        function(event) {

          if (event.key === "Enter") {
            iniciarSesion();
          }

        }
      );

  </script>

</body>
</html>
