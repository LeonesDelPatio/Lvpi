<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Estadísticas · Leones del Patio</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #090909;
      color: #f4f4f4;
      font-family: Arial, Helvetica, sans-serif;
    }

    .container {
      width: min(1100px, 92%);
      margin: 0 auto;
      padding: 50px 0 70px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 32px;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .subtitle {
      margin: 0;
      color: #777;
      font-size: 14px;
    }


    /* ============================= */
    /* LOGIN */
    /* ============================= */

    #login-section {
      max-width: 420px;
      margin: 80px auto;
    }

    #login-section h1 {
      margin-bottom: 10px;
    }

    .login-box {
      margin-top: 30px;
      padding: 30px;

      background: #131313;
      border: 1px solid #2c2c2c;
      border-radius: 10px;

      box-shadow:
        0 15px 40px rgba(0, 0, 0, 0.35);
    }

    input {
      width: 100%;

      padding: 14px;

      margin-bottom: 14px;

      background: #0b0b0b;
      color: #fff;

      border: 1px solid #333;
      border-radius: 6px;

      font-size: 14px;
      outline: none;

      transition:
        border-color 0.2s ease,
        background 0.2s ease;
    }

    input:focus {
      border-color: #777;
      background: #101010;
    }

    button {
      border: 0;
      border-radius: 6px;

      padding: 12px 20px;

      background: #eeeeee;
      color: #111;

      font-size: 14px;
      font-weight: 600;

      cursor: pointer;

      transition:
        background 0.2s ease,
        transform 0.2s ease;
    }

    button:hover {
      background: #ffffff;
      transform: translateY(-1px);
    }

    .error {
      margin-top: 15px;
      color: #e87878;
      font-size: 14px;
      line-height: 1.5;
    }


    /* ============================= */
    /* ESTADÍSTICAS */
    /* ============================= */

    #stats-section {
      display: none;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;

      gap: 20px;

      margin-bottom: 42px;
    }

    .top-bar button {
      background: transparent;
      color: #999;

      border: 1px solid #333;
    }

    .top-bar button:hover {
      color: #fff;
      border-color: #666;
      background: #111;
    }


    /* ============================= */
    /* RESET ESTADÍSTICAS */
    /* ============================= */

    .reset-panel {
      margin-bottom: 52px;
      padding: 22px 24px;
      background: #111;
      border: 1px solid #2b2b2b;
      border-radius: 9px;
    }

    .reset-panel-title {
      margin-bottom: 8px;
      color: #d0d0d0;
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    .reset-panel-text {
      margin: 0 0 18px;
      color: #777;
      font-size: 13px;
      line-height: 1.5;
    }

    .reset-button {
      background: transparent;
      color: #a8a8a8;
      border: 1px solid #444;
      padding: 10px 16px;
    }

    .reset-button:hover {
      background: #181818;
      color: #f0f0f0;
      border-color: #666;
    }

    .reset-button:disabled {
      opacity: 0.5;
      cursor: wait;
      transform: none;
    }

    .reset-status {
      margin-top: 12px;
      min-height: 20px;
      color: #777;
      font-size: 13px;
      line-height: 1.5;
    }

    .reset-status.success {
      color: #9aa88f;
    }

    .reset-status.error {
      color: #e87878;
    }


    /* ============================= */
    /* RESUMEN */
    /* ============================= */

    .summary {
      display: grid;
      grid-template-columns: repeat(2, 1fr);

      gap: 20px;

      margin-bottom: 52px;
    }

    .summary-card {
      position: relative;

      padding: 28px 30px;

      background: #141414;

      border: 1px solid #2d2d2d;
      border-radius: 10px;

      overflow: hidden;

      box-shadow:
        0 12px 30px rgba(0, 0, 0, 0.25);
    }

    .summary-card::before {
      content: "";

      position: absolute;

      top: 0;
      left: 0;

      width: 100%;
      height: 3px;

      background: #777;
    }

    .summary-card:first-child::before {
      background: #c7a86b;
    }

    .summary-card:last-child::before {
      background: #7d9bb8;
    }

    .summary-label {
      color: #888;

      font-size: 12px;
      font-weight: 600;

      text-transform: uppercase;
      letter-spacing: 0.12em;

      margin-bottom: 14px;
    }

    .summary-value {
      font-size: 42px;
      line-height: 1;

      font-weight: 600;

      letter-spacing: -0.03em;
    }

    .summary-card:first-child .summary-value {
      color: #c7a86b;
    }

    .summary-card:last-child .summary-value {
      color: #7d9bb8;
    }


    /* ============================= */
    /* ÁLBUMES */
    /* ============================= */

    .albums-title {
      margin-bottom: 18px;

      font-size: 12px;
      font-weight: 600;

      color: #777;

      text-transform: uppercase;
      letter-spacing: 0.12em;
    }

    .album {
      margin-bottom: 18px;

      background: #131313;

      border: 1px solid #2b2b2b;
      border-radius: 9px;

      overflow: hidden;

      box-shadow:
        0 8px 24px rgba(0, 0, 0, 0.18);
    }

    .album-header {
      display: flex;
      justify-content: space-between;
      align-items: center;

      gap: 20px;

      padding: 20px 22px;

      background: #181818;

      border-bottom: 1px solid #2d2d2d;
    }

    .album-name {
      font-size: 16px;
      font-weight: 600;

      color: #f0f0f0;
    }

    .album-total {
      color: #c7a86b;

      font-size: 13px;
      font-weight: 600;

      white-space: nowrap;
    }

    .songs {
      padding: 0 22px;
    }

    .song {
      display: flex;
      justify-content: space-between;
      align-items: center;

      gap: 20px;

      padding: 13px 0;

      border-bottom: 1px solid #242424;
    }

    .song:last-child {
      border-bottom: 0;
    }

    .song-name {
      color: #c4c4c4;

      font-size: 14px;
      line-height: 1.4;
    }

    .song-plays {
      color: #7d9bb8;

      font-size: 13px;
      font-weight: 600;

      white-space: nowrap;
    }


    /* ============================= */
    /* ESTADOS */
    /* ============================= */

    .empty {
      padding: 30px;

      text-align: center;

      color: #777;

      background: #131313;

      border: 1px solid #2b2b2b;
      border-radius: 8px;
    }

    .loading {
      color: #777;
      font-size: 14px;
    }


    /* ============================= */
    /* RESPONSIVE */
    /* ============================= */

    @media (max-width: 650px) {

      .container {
        padding-top: 30px;
      }

      .summary {
        grid-template-columns: 1fr;
      }

      .top-bar {
        align-items: flex-start;
      }

      .album-header,
      .song {
        align-items: flex-start;
      }

      .album-header {
        flex-direction: column;
        gap: 8px;
      }

      .song {
        flex-direction: column;
        gap: 5px;
      }

      .summary-value {
        font-size: 34px;
      }
    }
  </style>
</head>

<body>

  <!-- ============================= -->
  <!-- LOGIN -->
  <!-- ============================= -->

  <section id="login-section">

    <div class="container">

      <h1>Estadísticas</h1>

      <p class="subtitle">
        Panel privado · Leones del Patio
      </p>

      <div class="login-box">

        <input
          type="email"
          id="email"
          placeholder="Correo electrónico"
          autocomplete="email"
        >

        <input
          type="password"
          id="password"
          placeholder="Contraseña"
          autocomplete="current-password"
        >

        <button onclick="iniciarSesion()">
          Iniciar sesión
        </button>

        <div
          id="login-error"
          class="error"
        ></div>

      </div>

    </div>

  </section>


  <!-- ============================= -->
  <!-- ESTADÍSTICAS -->
  <!-- ============================= -->

  <section id="stats-section">

    <div class="container">

      <div class="top-bar">

        <div>

          <h1>Estadísticas</h1>

          <p class="subtitle">
            Leones del Patio
          </p>

        </div>

        <button onclick="cerrarSesion()">
          Cerrar sesión
        </button>

      </div>


      <!-- RESUMEN -->

      <div class="reset-panel">

        <div class="reset-panel-title">
          Reiniciar estadísticas
        </div>

        <p class="reset-panel-text">
          Elimina todas las visitas y reproducciones registradas.
          Esta acción no se puede deshacer.
        </p>

        <button
          id="reset-stats-button"
          class="reset-button"
          type="button"
          onclick="resetearEstadisticas()"
        >
          Resetear estadísticas
        </button>

        <div
          id="reset-status"
          class="reset-status"
          aria-live="polite"
        ></div>

      </div>


      <div class="summary">

        <div class="summary-card">

          <div class="summary-label">
            Visitas
          </div>

          <div
            id="total-visits"
            class="summary-value"
          >
            —
          </div>

        </div>


        <div class="summary-card">

          <div class="summary-label">
            Reproducciones
          </div>

          <div
            id="total-plays"
            class="summary-value"
          >
            —
          </div>

        </div>

      </div>


      <!-- ÁLBUMES -->

      <div class="albums-title">
        Álbumes
      </div>

      <div id="albums-container">

        <div class="loading">
          Cargando estadísticas...
        </div>

      </div>

    </div>

  </section>


  <!-- ============================= -->
  <!-- SUPABASE -->
  <!-- ============================= -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


  <script>

    const SUPABASE_URL =
      "https://cavnifartuktwmchyrdl.supabase.co";


    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_WC_7KWhh6gq-pvL-97D3VA_78DyHmOM";


    const client =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
      );


    // ==================================
    // INICIAR SESIÓN
    // ==================================

    async function iniciarSesion() {

      const email =
        document
          .getElementById("email")
          .value
          .trim();

      const password =
        document
          .getElementById("password")
          .value;

      const errorElement =
        document.getElementById(
          "login-error"
        );

      errorElement.textContent = "";


      if (!email || !password) {

        errorElement.textContent =
          "Introduce el correo y la contraseña.";

        return;
      }


      const { data, error } =
        await client.auth.signInWithPassword({
          email,
          password
        });


      if (error) {

        errorElement.textContent =
          "No se pudo iniciar sesión: " +
          error.message;

        return;
      }


      if (!data.session) {

        errorElement.textContent =
          "No se pudo establecer la sesión.";

        return;
      }


      document.getElementById(
        "login-section"
      ).style.display = "none";


      document.getElementById(
        "stats-section"
      ).style.display = "block";


      cargarEstadisticas();
    }


    // ==================================
    // CARGAR ESTADÍSTICAS
    // ==================================

    async function cargarEstadisticas() {

      const container =
        document.getElementById(
          "albums-container"
        );


      container.innerHTML =
        '<div class="loading">Cargando estadísticas...</div>';


      const {
        data,
        error
      } =
        await client.functions.invoke(
          "get-stats",
          {
            body: {}
          }
        );


      if (error) {

        console.error(
          "Error get-stats:",
          error
        );

        container.innerHTML =
          '<div class="error">No se pudieron cargar las estadísticas.</div>';

        return;
      }


      if (!data) {

        container.innerHTML =
          '<div class="error">No se recibieron datos.</div>';

        return;
      }


      // TOTAL VISITAS

      document.getElementById(
        "total-visits"
      ).textContent =
        data.visits ?? 0;


      // TOTAL REPRODUCCIONES

      document.getElementById(
        "total-plays"
      ).textContent =
        data.total ?? 0;


      // ÁLBUMES

      if (
        !data.albums ||
        data.albums.length === 0
      ) {

        container.innerHTML =
          '<div class="empty">Todavía no hay reproducciones.</div>';

        return;
      }


      container.innerHTML = "";


      for (const album of data.albums) {

        const albumElement =
          document.createElement("div");

        albumElement.className =
          "album";


        // CABECERA DEL ÁLBUM

        const header =
          document.createElement("div");

        header.className =
          "album-header";


        const name =
          document.createElement("div");

        name.className =
          "album-name";

        name.textContent =
          album.album;


        const total =
          document.createElement("div");

        total.className =
          "album-total";

        total.textContent =
          `${album.total} reproducciones`;


        header.appendChild(name);
        header.appendChild(total);


        // CANCIONES

        const songsContainer =
          document.createElement("div");

        songsContainer.className =
          "songs";


        for (const song of album.songs) {

          const songElement =
            document.createElement("div");

          songElement.className =
            "song";


          const songName =
            document.createElement("div");

          songName.className =
            "song-name";

          songName.textContent =
            song.song;


          const songPlays =
            document.createElement("div");

          songPlays.className =
            "song-plays";

          songPlays.textContent =
            `${song.plays} reproducciones`;


          songElement.appendChild(
            songName
          );

          songElement.appendChild(
            songPlays
          );


          songsContainer.appendChild(
            songElement
          );
        }


        albumElement.appendChild(
          header
        );

        albumElement.appendChild(
          songsContainer
        );


        container.appendChild(
          albumElement
        );
      }
    }


    // ==================================
    // RESET ESTADÍSTICAS
    // ==================================

    async function resetearEstadisticas() {

      const confirmar = window.confirm(
        "¿Seguro que quieres resetear las estadísticas?\\n\\n" +
        "Se eliminarán todas las visitas y reproducciones registradas.\\n" +
        "Esta acción no se puede deshacer."
      );

      if (!confirmar) {
        return;
      }

      const button =
        document.getElementById("reset-stats-button");

      const status =
        document.getElementById("reset-status");

      button.disabled = true;
      button.textContent = "Reseteando...";
      status.className = "reset-status";
      status.textContent = "Eliminando estadísticas...";

      try {

        const {
          data,
          error
        } =
          await client.functions.invoke(
            "reset-stats",
            {
              body: {}
            }
          );

        if (error) {
          console.error(
            "Error reset-stats:",
            error
          );

          throw new Error(
            error.message ||
            "No se pudieron resetear las estadísticas."
          );
        }

        if (!data || !data.success) {
          throw new Error(
            data?.error ||
            "La función no confirmó el reinicio."
          );
        }

        status.className =
          "reset-status success";

        status.textContent =
          "Estadísticas restablecidas correctamente.";

        await cargarEstadisticas();

      } catch (error) {

        console.error(
          "Error al resetear estadísticas:",
          error
        );

        status.className =
          "reset-status error";

        status.textContent =
          error.message ||
          "No se pudieron resetear las estadísticas.";

      } finally {

        button.disabled = false;
        button.textContent =
          "Resetear estadísticas";
      }
    }


    // ==================================
    // CERRAR SESIÓN
    // ==================================

    async function cerrarSesion() {

      await client.auth.signOut();


      document.getElementById(
        "stats-section"
      ).style.display = "none";


      document.getElementById(
        "login-section"
      ).style.display = "block";


      document.getElementById(
        "password"
      ).value = "";
    }


    // ==================================
    // ENTER PARA INICIAR SESIÓN
    // ==================================

    document
      .getElementById("password")
      .addEventListener(
        "keydown",
        function(event) {

          if (event.key === "Enter") {
            iniciarSesion();
          }

        }
      );

  </script>

</body>
</html>
