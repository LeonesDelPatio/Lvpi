<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Prueba estadísticas</title>

  <style>
    body {
      margin: 0;
      padding: 40px;
      background: #111;
      color: #eee;
      font-family: Arial, sans-serif;
    }

    .box {
      max-width: 700px;
      margin: 0 auto;
    }

    input {
      display: block;
      width: 100%;
      box-sizing: border-box;
      margin: 10px 0;
      padding: 12px;
      background: #222;
      color: #fff;
      border: 1px solid #444;
      border-radius: 4px;
    }

    button {
      padding: 12px 20px;
      margin-top: 10px;
      background: #eee;
      color: #111;
      border: 0;
      border-radius: 4px;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.85;
    }

    pre {
      margin-top: 30px;
      padding: 20px;
      background: #000;
      border: 1px solid #333;
      overflow-x: auto;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>

  <div class="box">

    <h1>Prueba de estadísticas</h1>

    <input
      id="email"
      type="email"
      placeholder="Email"
      autocomplete="username"
    >

    <input
      id="password"
      type="password"
      placeholder="Contraseña"
      autocomplete="current-password"
    >

    <button
      id="loginButton"
      type="button"
    >
      Iniciar sesión
    </button>

    <pre id="result">Cargando...</pre>

  </div>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


  <script>

    const result =
      document.getElementById("result");

    result.textContent =
      "1. Página cargada.\n";


    const SUPABASE_URL =
      "https://cavnifartuktwmchyrdl.supabase.co";


    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_WC_7KWhh6gq-pvL-97D3VA_78DyHmOM";


    /*
     * Comprobar que la biblioteca de Supabase
     * se ha cargado correctamente.
     */

    if (
      !window.supabase ||
      !window.supabase.createClient
    ) {

      result.textContent +=
        "\nERROR: No se ha podido cargar la biblioteca de Supabase.";

      throw new Error(
        "Supabase JS no está disponible."
      );
    }


    result.textContent +=
      "2. Biblioteca de Supabase cargada.\n";


    const supabase =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
      );


    result.textContent +=
      "3. Cliente Supabase creado.\n";


    const button =
      document.getElementById(
        "loginButton"
      );


    button.addEventListener(
      "click",
      async function () {

        result.textContent =
          "4. Botón pulsado.\n";


        const email =
          document
            .getElementById("email")
            .value
            .trim();


        const password =
          document
            .getElementById("password")
            .value;


        if (!email || !password) {

          result.textContent +=
            "\nERROR: Falta el email o la contraseña.";

          return;
        }


        try {

          result.textContent +=
            "\n5. Intentando iniciar sesión...\n";


          const {
            data,
            error
          } =
            await supabase.auth.signInWithPassword({
              email: email,
              password: password
            });


          if (error) {

            result.textContent +=
              "\nERROR DE LOGIN:\n\n" +
              error.message;

            return;
          }


          if (!data || !data.session) {

            result.textContent +=
              "\nERROR: Login realizado pero no se ha obtenido una sesión.";

            return;
          }


          result.textContent +=
            "\n6. LOGIN CORRECTO.\n";


          result.textContent +=
            "\nUsuario:\n" +
            data.user.id;


          result.textContent +=
            "\n\n7. Consultando get-stats...\n";


          const {
            data: stats,
            error: statsError
          } =
            await supabase.functions.invoke(
              "get-stats",
              {
                body: {}
              }
            );


          if (statsError) {

            result.textContent +=
              "\nERROR DE GET-STATS:\n\n" +
              statsError.message;

            console.error(
              "get-stats error:",
              statsError
            );

            return;
          }


          result.textContent +=
            "\n8. GET-STATS CORRECTO.\n\n";


          result.textContent +=
            JSON.stringify(
              stats,
              null,
              2
            );


        } catch (error) {

          result.textContent +=
            "\nERROR INESPERADO:\n\n" +
            (
              error instanceof Error
                ? error.message
                : String(error)
            );

          console.error(error);
        }

      }
    );


    result.textContent +=
      "4. Esperando al botón...\n";

  </script>

</body>
</html>
