<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Prueba estadísticas</title>

  <style>
    body {
      margin: 0;
      padding: 40px;
      background: #111;
      color: #eee;
      font-family: Arial, sans-serif;
    }

    .box {
      max-width: 700px;
      margin: 0 auto;
    }

    input {
      display: block;
      width: 100%;
      box-sizing: border-box;
      margin: 10px 0;
      padding: 12px;
      background: #222;
      color: #fff;
      border: 1px solid #444;
      border-radius: 4px;
    }

    button {
      padding: 12px 20px;
      margin-top: 10px;
      background: #eee;
      color: #111;
      border: 0;
      border-radius: 4px;
      cursor: pointer;
    }

    pre {
      margin-top: 30px;
      padding: 20px;
      background: #000;
      border: 1px solid #333;
      overflow-x: auto;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>

  <div class="box">

    <h1>Prueba de estadísticas</h1>

    <input
      id="email"
      type="email"
      placeholder="Email"
    >

    <input
      id="password"
      type="password"
      placeholder="Contraseña"
    >

    <button
      type="button"
      onclick="iniciarSesion()"
    >
      Iniciar sesión
    </button>

    <pre id="resultado">La página se está cargando...</pre>

  </div>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>

    const resultado =
      document.getElementById("resultado");


    resultado.textContent =
      "1. JavaScript cargado.\n";


    const SUPABASE_URL =
      "https://cavnifartuktwmchyrdl.supabase.co";


    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_WC_7KWhh6gq-pvL-97D3VA_78DyHmOM";


    resultado.textContent +=
      "2. Configuración cargada.\n";


    if (
      typeof window.supabase === "undefined"
    ) {

      resultado.textContent +=
        "\nERROR:\n" +
        "La biblioteca de Supabase NO se ha cargado.";

    } else {

      resultado.textContent +=
        "3. Biblioteca Supabase detectada.\n";

    }


    async function iniciarSesion() {

      resultado.textContent =
        "4. BOTÓN PULSADO.\n";


      const email =
        document
          .getElementById("email")
          .value
          .trim();


      const password =
        document
          .getElementById("password")
          .value;


      resultado.textContent +=
        "\n5. Email recibido: " +
        (email ? "SÍ" : "NO");


      resultado.textContent +=
        "\n6. Contraseña recibida: " +
        (password ? "SÍ" : "NO");


      if (!email || !password) {

        resultado.textContent +=
          "\n\nFalta el email o la contraseña.";

        return;
      }


      if (
        typeof window.supabase === "undefined"
      ) {

        resultado.textContent +=
          "\n\nERROR: Supabase no está disponible.";

        return;
      }


      try {

        resultado.textContent +=
          "\n\n7. Creando cliente Supabase...";


        const cliente =
          window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_PUBLISHABLE_KEY
          );


        resultado.textContent +=
          "\n8. Cliente creado.";


        resultado.textContent +=
          "\n\n9. Intentando iniciar sesión...";


        const respuesta =
          await cliente.auth.signInWithPassword({
            email: email,
            password: password
          });


        if (respuesta.error) {

          resultado.textContent +=
            "\n\nERROR DE LOGIN:\n" +
            respuesta.error.message;

          return;
        }


        if (!respuesta.data.session) {

          resultado.textContent +=
            "\n\nERROR: No se recibió ninguna sesión.";

          return;
        }


        resultado.textContent +=
          "\n\n10. LOGIN CORRECTO.";


        resultado.textContent +=
          "\n\nUID:\n" +
          respuesta.data.user.id;


        resultado.textContent +=
          "\n\n11. Consultando get-stats...";


        const stats =
          await cliente.functions.invoke(
            "get-stats",
            {
              body: {}
            }
          );


        if (stats.error) {

          resultado.textContent +=
            "\n\nERROR DE GET-STATS:\n" +
            stats.error.message;

          console.error(
            stats.error
          );

          return;
        }


        resultado.textContent +=
          "\n\n12. GET-STATS CORRECTO.\n\n";


        resultado.textContent +=
          JSON.stringify(
            stats.data,
            null,
            2
          );


      } catch (error) {

        resultado.textContent +=
          "\n\nERROR INESPERADO:\n\n" +
          (
            error instanceof Error
              ? error.message
              : String(error)
          );

        console.error(error);
      }

    }

  </script>

</body>
</html>
