<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Prueba estadísticas</title>

  <style>
    body {
      margin: 0;
      padding: 40px;
      background: #111;
      color: #eee;
      font-family: Arial, sans-serif;
    }

    .box {
      max-width: 700px;
      margin: 0 auto;
    }

    input {
      display: block;
      width: 100%;
      box-sizing: border-box;
      margin: 10px 0;
      padding: 12px;
      background: #222;
      color: #fff;
      border: 1px solid #444;
      border-radius: 4px;
    }

    button {
      padding: 12px 20px;
      margin-top: 10px;
      background: #eee;
      color: #111;
      border: 0;
      border-radius: 4px;
      cursor: pointer;
    }

    pre {
      margin-top: 30px;
      padding: 20px;
      background: #000;
      border: 1px solid #333;
      overflow-x: auto;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>

  <div class="box">

    <h1>Prueba de estadísticas</h1>

    <input
      id="email"
      type="email"
      placeholder="Email"
      autocomplete="username"
    >

    <input
      id="password"
      type="password"
      placeholder="Contraseña"
      autocomplete="current-password"
    >

    <button id="loginButton">
      Iniciar sesión y consultar estadísticas
    </button>

    <pre id="result">Esperando...</pre>

  </div>


  <script>

    const SUPABASE_URL =
      "https://cavnifartuktwmchyrdl.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_WC_7KWhh6gq-pvL-97D3VA_78DyHmOM";

    const GET_STATS_URL =
      `${SUPABASE_URL}/functions/v1/get-stats`;


    const result =
      document.getElementById("result");


    document
      .getElementById("loginButton")
      .addEventListener(
        "click",
        loginAndGetStats
      );


    async function loginAndGetStats() {

      result.textContent =
        "Iniciando sesión...";


      const email =
        document
          .getElementById("email")
          .value
          .trim();

      const password =
        document
          .getElementById("password")
          .value;


      if (!email || !password) {

        result.textContent =
          "Introduce el email y la contraseña.";

        return;
      }


      try {

        /*
         * 1. Iniciar sesión en Supabase Auth
         */

        const loginResponse =
          await fetch(
            `${SUPABASE_URL}/auth/v1/token?grant_type=password`,
            {
              method: "POST",

              headers: {
                "apikey":
                  SUPABASE_PUBLISHABLE_KEY,

                "Content-Type":
                  "application/json"
              },

              body:
                JSON.stringify({
                  email,
                  password
                })
            }
          );


        const loginData =
          await loginResponse.json();


        if (!loginResponse.ok) {

          throw new Error(
            loginData.error_description ||
            loginData.msg ||
            "No se pudo iniciar sesión."
          );
        }


        const accessToken =
          loginData.access_token;


        if (!accessToken) {

          throw new Error(
            "Supabase no devolvió un access token."
          );
        }


        result.textContent =
          "Sesión iniciada correctamente.\n\n" +
          "Consultando get-stats...";


        /*
         * 2. Consultar get-stats utilizando
         *    el JWT del usuario
         */

        const statsResponse =
          await fetch(
            GET_STATS_URL,
            {
              method: "POST",

              headers: {

                "apikey":
                  SUPABASE_PUBLISHABLE_KEY,

                "Authorization":
                  `Bearer ${accessToken}`,

                "Content-Type":
                  "application/json"
              },

              body:
                JSON.stringify({})
            }
          );


        const statsData =
          await statsResponse.json();


        /*
         * 3. Mostrar resultado
         */

        result.textContent =
          JSON.stringify(
            statsData,
            null,
            2
          );


      } catch (error) {

        console.error(error);

        result.textContent =
          "ERROR:\n\n" +
          (
            error instanceof Error
              ? error.message
              : String(error)
          );
      }
    }

  </script>

</body>
</html>
