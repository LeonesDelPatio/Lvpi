<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Music</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #111;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }

    .container {
      width: min(900px, 92%);
      margin: 0 auto;
      padding: 40px 0 60px;
      text-align: center;
    }

    h1 {
      margin: 0 0 30px;
      font-size: 28px;
      font-weight: 500;
    }

    .album-selector {
      margin-bottom: 30px;
    }

    select {
      width: 100%;
      max-width: 600px;
      padding: 12px 14px;
      background: #1d1d1d;
      color: #fff;
      border: 1px solid #444;
      border-radius: 6px;
      font-size: 15px;
      cursor: pointer;
    }

    .cover-container {
      width: min(500px, 90%);
      margin: 0 auto 25px;
    }

    .cover-container img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 4px;
    }

    audio {
      width: min(700px, 100%);
      margin: 0 auto 25px;
      display: block;
    }

    .now-playing {
      margin: 10px auto 30px;
      text-align: center;
      max-width: 750px;
    }

    .now-playing-label {
      display: block;
      margin-bottom: 7px;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #888;
    }

    #songTitle {
      display: block;
      font-size: 17px;
      line-height: 1.5;
      color: #fff;
    }

    .songs {
      width: min(750px, 100%);
      margin: 0 auto;
      text-align: left;
    }

    .song {
      padding: 12px 14px;
      border-bottom: 1px solid #2a2a2a;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .song:hover {
      background: #1b1b1b;
    }

    .song.active {
      background: #222;
    }

    @media (max-width: 600px) {

      .container {
        padding-top: 25px;
      }

      h1 {
        font-size: 24px;
      }

      #songTitle {
        font-size: 15px;
      }

      .song {
        padding: 11px 10px;
      }

    }


/* ============================= */
/* FOOTER                         */
/* ============================= */

.site-footer {
  width: min(1100px, 92%);
  margin: 90px auto 0;
  padding: 45px 0 22px;

  border-top: 1px solid rgba(255, 255, 255, 0.12);

  text-align: center;
}


/* LOGOS */

.footer-logos {
  display: flex;
  justify-content: center;
  align-items: center;

  gap: 45px;

  margin-bottom: 45px;
}

.footer-logo {
  display: block;

  width: auto;
  height: auto;

  max-height: 58px;
  max-width: 180px;

  object-fit: contain;

  opacity: 0.92;

  transition:
    opacity 0.2s ease,
    transform 0.2s ease;
}

.footer-logo:hover {
  opacity: 1;
  transform: translateY(-2px);
}


/* RRSS */

.footer-rrss {
  display: inline-flex;

  flex-direction: column;
  align-items: center;

  gap: 13px;

  color: #aaa;

  text-decoration: none;

  transition:
    color 0.2s ease,
    opacity 0.2s ease;
}

.footer-rrss:hover {
  color: #fff;
}


/* QR */

.footer-qr {
  display: block;

  width: 120px;
  height: 120px;

  object-fit: contain;

  opacity: 0.9;

  transition:
    opacity 0.2s ease,
    transform 0.2s ease;
}

.footer-rrss:hover .footer-qr {
  opacity: 1;
  transform: translateY(-2px);
}


/* TEXTO RRSS */

.footer-rrss span {
  font-size: 13px;

  letter-spacing: 0.04em;

  text-transform: uppercase;
}


/* COPYRIGHT */

.footer-copyright {
  margin-top: 42px;

  text-align: right;

  color: #555;

  font-size: 10px;

  letter-spacing: 0.03em;
}


/* RESPONSIVE */

@media (max-width: 600px) {

  .site-footer {
    margin-top: 65px;
    padding-top: 35px;
  }

  .footer-logos {
    gap: 25px;
    margin-bottom: 38px;
  }

  .footer-logo {
    max-width: 135px;
    max-height: 48px;
  }

  .footer-qr {
    width: 105px;
    height: 105px;
  }

  .footer-copyright {
    margin-top: 35px;

    text-align: center;

    font-size: 9px;
  }
}

    
  </style>
</head>

<body>

  <div class="container">

    <h1>Music</h1>

    <div class="album-selector">
      <select id="albumSelect"></select>
    </div>

    <div class="cover-container">
      <img
        id="coverImage"
        alt="Portada del álbum"
      >
    </div>

    <audio
      id="audioPlayer"
      controls
      controlslist="nodownload noremoteplayback"
      noremoteplayback
      preload="metadata"
    ></audio>

    <div class="now-playing">

      <span class="now-playing-label">
        Reproduciendo
      </span>

      <span id="songTitle">
        Ninguna canción
      </span>

    </div>

    <div
      id="songList"
      class="songs"
    ></div>

  </div>


  <script>


    async function loadRRSS() {

  try {

    const response =
      await fetch(
        RRSS_FUNCTION_URL,
        {
          method: "GET",
          headers: {
            "apikey":
              SUPABASE_PUBLISHABLE_KEY
          }
        }
      );


    if (!response.ok) {

      throw new Error(
        `Error HTTP ${response.status}`
      );
    }


    const data =
      await response.json();


    if (
      !data.lnsLogo ||
      !data.baalLogo ||
      !data.qr
    ) {

      throw new Error(
        "get-rrss no devolvió todos los recursos."
      );
    }


    document.getElementById(
      "footer-lns-logo"
    ).src =
      data.lnsLogo;


    document.getElementById(
      "footer-baal-logo"
    ).src =
      data.baalLogo;


    document.getElementById(
      "footer-qr"
    ).src =
      data.qr;


    const rrssLink =
      document.getElementById(
        "footer-rrss-link"
      );


    if (data.linktree) {

      rrssLink.href =
        data.linktree;
    }


  } catch (error) {

    console.error(
      "Error cargando recursos RRSS:",
      error
    );

  }
}

    
    /* =====================================================
       CONFIGURACIÓN SUPABASE
       ===================================================== */
    
    
    const RRSS_FUNCTION_URL =
      `${SUPABASE_URL}/functions/v1/get-rrss`;
    
    
    const SUPABASE_URL =
      "https://cavnifartuktwmchyrdl.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_WC_7KWhh6gq-pvL-97D3VA_78DyHmOM";


    const CATALOG_FUNCTION_URL =
      `${SUPABASE_URL}/functions/v1/get-catalog`;

    const AUDIO_FUNCTION_URL =
      `${SUPABASE_URL}/functions/v1/get-audio-url`;

    const REGISTER_PLAY_FUNCTION_URL =
      `${SUPABASE_URL}/functions/v1/register-play`;

    const REGISTER_VISIT_FUNCTION_URL =
      `${SUPABASE_URL}/functions/v1/register-visit`;


    /* =====================================================
       ELEMENTOS HTML
       ===================================================== */

    const albumSelect =
      document.getElementById("albumSelect");

    const coverImage =
      document.getElementById("coverImage");

    const audioPlayer =
      document.getElementById("audioPlayer");

    const songTitle =
      document.getElementById("songTitle");

    const songList =
      document.getElementById("songList");


    /* =====================================================
       VARIABLES
       ===================================================== */

    let albums = [];

    let currentAlbumIndex = 0;

    let currentSongIndex = 0;


    /* =====================================================
       REGISTRAR VISITA
       ===================================================== */

    async function registerVisit() {

      try {

        const response =
          await fetch(
            REGISTER_VISIT_FUNCTION_URL,
            {
              method: "POST",

              headers: {
                "apikey":
                  SUPABASE_PUBLISHABLE_KEY,

                "Content-Type":
                  "application/json"
              },

              body:
                JSON.stringify({})
            }
          );


        const result =
          await response.json();


        if (!response.ok) {

          throw new Error(
            result.error ||
            "No se pudo registrar la visita."
          );

        }


        console.log(
          "Visita registrada."
        );


      } catch (error) {

        /*
          Un fallo de estadísticas
          nunca debe impedir que
          la web continúe cargando.
        */

        console.error(
          "Error registrando visita:",
          error
        );

      }

    }


    /* =====================================================
       OBTENER CATÁLOGO
       ===================================================== */

    async function loadCatalog() {

      try {

        const response =
          await fetch(
            CATALOG_FUNCTION_URL,
            {
              method: "POST",

              headers: {
                "apikey":
                  SUPABASE_PUBLISHABLE_KEY,

                "Content-Type":
                  "application/json"
              }
            }
          );


        const result =
          await response.json();


        if (!response.ok) {

          throw new Error(
            result.error ||
            "No se pudo cargar el catálogo."
          );

        }


        albums =
          result.albums || [];


        if (albums.length === 0) {

          throw new Error(
            "No se encontraron álbumes."
          );

        }


        renderAlbumSelector();


        /*
          Seleccionamos automáticamente
          el álbum más reciente.
        */

        selectAlbum(0);


      } catch (error) {

        console.error(
          "Error cargando catálogo:",
          error
        );

      }

    }


    /* =====================================================
       SELECTOR DE ÁLBUMES
       ===================================================== */

    function renderAlbumSelector() {

      albumSelect.innerHTML = "";


      albums.forEach(
        (album, index) => {

          const option =
            document.createElement("option");

          option.value =
            index;

          option.textContent =
            `${album.name} (${album.year})`;

          albumSelect.appendChild(
            option
          );

        }
      );

    }


    /* =====================================================
       CAMBIAR DE ÁLBUM
       ===================================================== */

    function selectAlbum(index) {

      currentAlbumIndex =
        Number(index);

      currentSongIndex = 0;


      albumSelect.value =
        currentAlbumIndex;


      const album =
        albums[currentAlbumIndex];


      renderSongList();


      loadCover(
        album.cover
      );


      /*
        Al seleccionar un álbum,
        comenzamos automáticamente
        por la canción 01.
      */

      playSong(0);

    }


    /* =====================================================
       CAMBIO MANUAL DESDE EL SELECT
       ===================================================== */

    albumSelect.addEventListener(
      "change",
      () => {

        selectAlbum(
          Number(
            albumSelect.value
          )
        );

      }
    );


    /* =====================================================
       MOSTRAR LISTA DE CANCIONES
       ===================================================== */

    function renderSongList() {

      songList.innerHTML = "";


      const album =
        albums[currentAlbumIndex];


      album.songs.forEach(
        (song, index) => {

          const element =
            document.createElement("div");


          element.className =
            "song";


          if (
            index === currentSongIndex
          ) {

            element.classList.add(
              "active"
            );

          }


          element.textContent =
            song.name;


          element.addEventListener(
            "click",
            () => {

              playSong(index);

            }
          );


          songList.appendChild(
            element
          );

        }
      );

    }


    /* =====================================================
       OBTENER PORTADA
       ===================================================== */

    async function loadCover(
      coverPath
    ) {

      if (!coverPath) {

        coverImage.removeAttribute(
          "src"
        );

        return;

      }


      try {

        const response =
          await fetch(
            AUDIO_FUNCTION_URL,
            {
              method: "POST",

              headers: {
                "apikey":
                  SUPABASE_PUBLISHABLE_KEY,

                "Content-Type":
                  "application/json"
              },

              body:
                JSON.stringify({
                  path:
                    coverPath
                })
            }
          );


        const result =
          await response.json();


        if (!response.ok) {

          throw new Error(
            result.error ||
            "No se pudo obtener la portada."
          );

        }


        if (!result.signedUrl) {

          throw new Error(
            "Supabase no devolvió una URL firmada para la portada."
          );

        }


        coverImage.src =
          result.signedUrl;


      } catch (error) {

        console.error(
          "Error cargando portada:",
          error
        );


        coverImage.removeAttribute(
          "src"
        );

      }

    }


    /* =====================================================
       REGISTRAR REPRODUCCIÓN
       ===================================================== */

    async function registerPlay(
      album,
      song
    ) {

      try {

        const response =
          await fetch(
            REGISTER_PLAY_FUNCTION_URL,
            {
              method: "POST",

              headers: {
                "apikey":
                  SUPABASE_PUBLISHABLE_KEY,

                "Content-Type":
                  "application/json"
              },

              body:
                JSON.stringify({
                  album:
                    album,

                  song:
                    song
                })
            }
          );


        const result =
          await response.json();


        if (!response.ok) {

          throw new Error(
            result.error ||
            "No se pudo registrar la reproducción."
          );

        }


        console.log(
          "Reproducción registrada:",
          album,
          song
        );


      } catch (error) {

        /*
          Un fallo de estadísticas
          nunca debe detener la música.
        */

        console.error(
          "Error registrando reproducción:",
          error
        );

      }

    }


    /* =====================================================
       REPRODUCIR CANCIÓN
       ===================================================== */

    async function playSong(
      index
    ) {

      const album =
        albums[currentAlbumIndex];


      const song =
        album.songs[index];


      if (!song) {

        return;

      }


      currentSongIndex =
        index;


      songTitle.textContent =
        song.name;


      renderSongList();


      try {

        /*
          Obtener URL firmada
          para el archivo de audio.
        */

        const response =
          await fetch(
            AUDIO_FUNCTION_URL,
            {
              method: "POST",

              headers: {
                "apikey":
                  SUPABASE_PUBLISHABLE_KEY,

                "Content-Type":
                  "application/json"
              },

              body:
                JSON.stringify({
                  path:
                    song.path
                })
            }
          );


        const result =
          await response.json();


        if (!response.ok) {

          throw new Error(
            result.error ||
            "No se pudo obtener el audio."
          );

        }


        if (!result.signedUrl) {

          throw new Error(
            "Supabase no devolvió una URL firmada."
          );

        }


        /*
          Cargar el audio.
        */

        audioPlayer.src =
          result.signedUrl;


        /*
          Intentar comenzar la reproducción.
        */

        await audioPlayer.play();


        /*
          MUY IMPORTANTE:
          solo llegamos aquí si play()
          se ha iniciado correctamente.

          Por tanto, aquí registramos
          la reproducción.
        */

        await registerPlay(
          album.name,
          song.name
        );


      } catch (error) {

        console.error(
          "Error reproduciendo canción:",
          error
        );

      }

    }


    /* =====================================================
       CUANDO TERMINA UNA CANCIÓN
       ===================================================== */

    audioPlayer.addEventListener(
      "ended",
      () => {

        const album =
          albums[currentAlbumIndex];


        /*
          Todavía quedan canciones
          dentro del álbum.
        */

        if (
          currentSongIndex <
          album.songs.length - 1
        ) {

          playSong(
            currentSongIndex + 1
          );

          return;

        }


        /*
          Última canción del álbum.
          Pasamos al siguiente álbum.
        */

        if (
          currentAlbumIndex <
          albums.length - 1
        ) {

          currentAlbumIndex++;


          currentSongIndex = 0;


          albumSelect.value =
            currentAlbumIndex;


          const nextAlbum =
            albums[currentAlbumIndex];


          renderSongList();


          loadCover(
            nextAlbum.cover
          );


          playSong(0);


          return;

        }


        /*
          Hemos terminado el último
          álbum del catálogo.

          Volvemos al primero.
        */

        currentAlbumIndex = 0;

        currentSongIndex = 0;


        albumSelect.value =
          currentAlbumIndex;


        const firstAlbum =
          albums[0];


        renderSongList();


        loadCover(
          firstAlbum.cover
        );


        playSong(0);

      }
    );


    /* =====================================================
       INICIAR
       ===================================================== */

    registerVisit();

    loadCatalog();

    loadRRSS();

  </script>


<footer class="site-footer">

  <div class="footer-logos">

    <img
      id="footer-lns-logo"
      class="footer-logo footer-logo-lns"
      alt="LNS"
    >

    <img
      id="footer-baal-logo"
      class="footer-logo footer-logo-baal"
      alt="Baal"
    >

  </div>


  <a
    id="footer-rrss-link"
    class="footer-rrss"
    href="https://linktr.ee/LvpiAKAJohnOPerdono"
    target="_blank"
    rel="noopener noreferrer"
  >

    <img
      id="footer-qr"
      class="footer-qr"
      alt="QR para redes sociales"
    >

    <span>
      Click para RRSS
    </span>

  </a>


  <div class="footer-copyright">
    © Todos los derechos reservados para Lvpi y Leones del Patio
  </div>

</footer>
  
  
</body>
</html>
