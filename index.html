  <title>Lvpi</title>

  <style>

    * {
      box-sizing: border-box;
    }

    html {
      background: #0a0a0b;
    }

    body {
      margin: 0;
      background:
        radial-gradient(
          ellipse 75% 45% at 50% 0%,
          #202023 0%,
          #121214 42%,
          #0a0a0b 100%
        );
      background-attachment: fixed;
      color: #e7e5e0;
      font-family:
        "Trebuchet MS",
        Arial,
        Helvetica,
        sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    .container {
      width: min(900px, 92%);
      margin: 0 auto;
      padding: 58px 0 75px;
      text-align: center;
    }


    /* =====================================================
       TÍTULO
       ===================================================== */

    h1 {
      margin: 0 0 38px;
      color: #e9e7e2;
      font-family:
        Georgia,
        "Times New Roman",
        serif;
      font-size: 42px;
      font-weight: 400;
      letter-spacing: 0.12em;
      line-height: 1;
      text-shadow:
        0 2px 18px rgba(0, 0, 0, 0.35);
    }


    /* =====================================================
       SELECTOR DE ÁLBUM
       ===================================================== */

    .album-selector {
      margin-bottom: 34px;
    }

    select {
      width: 100%;
      max-width: 600px;
      height: 47px;
      padding: 0 16px;
      background: #19191b;
      color: #d9d6d0;
      border: 1px solid #3a3a3d;
      border-radius: 6px;
      font-family:
        "Trebuchet MS",
        Arial,
        Helvetica,
        sans-serif;
      font-size: 13px;
      letter-spacing: 0.035em;
      cursor: pointer;
      outline: none;
      color-scheme: dark;
      transition:
        background 0.2s ease,
        border-color 0.2s ease;
    }

    select:hover {
      background: #202023;
      border-color: #555559;
    }

    select:focus {
      background: #202023;
      border-color: #67676b;
    }


    /* =====================================================
       PORTADA
       ===================================================== */

    .cover-container {
      width: min(500px, 90%);
      margin: 0 auto 32px;
    }

    .cover-container img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 6px;
      box-shadow:
        0 22px 55px rgba(0, 0, 0, 0.48),
        0 0 0 1px rgba(255, 255, 255, 0.035);
      user-select: none;
      -webkit-user-select: none;
      -webkit-user-drag: none;
    }


    /* =====================================================
       REPRODUCTOR
       ===================================================== */

    audio {
      width: min(700px, 100%);
      height: 42px;
      margin: 0 auto 31px;
      display: block;

      background: #242426;
      border: 1px solid #363638;
      border-radius: 6px;

      color-scheme: dark;
      accent-color: #aaa7a1;

      box-shadow:
        0 7px 22px rgba(0, 0, 0, 0.22);
    }


    /* =====================================================
       CANCIÓN ACTUAL
       ===================================================== */

    .now-playing {
      margin: 0 auto 38px;
      padding: 18px 20px 19px;
      max-width: 750px;

      background: #151517;
      border: 1px solid #29292c;
      border-radius: 6px;

      text-align: center;

      box-shadow:
        0 10px 28px rgba(0, 0, 0, 0.16);
    }

    .now-playing-label {
      display: block;
      margin-bottom: 9px;

      color: #777579;

      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 3px;
    }

    #songTitle {
      display: block;

      color: #e3e0da;

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size: 18px;
      font-weight: 400;
      line-height: 1.5;
      letter-spacing: 0.02em;
    }


    /* =====================================================
       LISTA DE CANCIONES
       ===================================================== */

    .songs {
      width: min(750px, 100%);
      margin: 0 auto;

      background: #151517;
      border: 1px solid #29292c;
      border-radius: 6px;

      overflow: hidden;
      text-align: left;

      box-shadow:
        0 10px 28px rgba(0, 0, 0, 0.16);
    }

    .song {
      position: relative;

      padding: 14px 18px;

      border-bottom: 1px solid #29292c;

      color: #969398;

      cursor: pointer;

      font-size: 13px;
      line-height: 1.5;
      letter-spacing: 0.015em;

      transition:
        background 0.2s ease,
        color 0.2s ease,
        padding-left 0.2s ease;
    }

    .song:last-child {
      border-bottom: none;
    }

    .song:hover {
      padding-left: 23px;
      background: #1e1e21;
      color: #d4d1cb;
    }

    .song.active {
      padding-left: 23px;
      background: #242427;
      color: #eeeae3;
    }

    .song.active::before {
      content: "";

      position: absolute;

      left: 0;
      top: 0;
      bottom: 0;

      width: 3px;

      background: #aaa6a0;
    }


    /* =====================================================
       FOOTER
       ===================================================== */

    .site-footer {
      width: 100%;
      margin-top: 0;
      padding: 72px 20px 25px;

      border-top: 1px solid #242427;

      background:
        linear-gradient(
          to bottom,
          rgba(10, 10, 11, 0.12),
          rgba(7, 7, 8, 0.52)
        );

      text-align: center;
    }

    .footer-content {
      width: min(900px, 100%);
      margin: 0 auto;
    }

    .footer-logos {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 95px;

      min-height: 120px;

      margin: 0 auto 55px;
      padding: 0 20px;
    }

    .footer-logo {
      display: block;

      width: auto;
      height: 88px;
      max-width: 310px;

      object-fit: contain;

      opacity: 0.52;

      user-select: none;
      -webkit-user-select: none;
      -webkit-user-drag: none;

      pointer-events: auto;

      transition:
        opacity 0.25s ease,
        transform 0.25s ease;
    }

    .footer-logo:hover {
      opacity: 0.94;
      transform: scale(1.035);
    }

    .footer-qr-link {
      display: block;
      width: fit-content;

      margin: 0 auto;

      line-height: 0;
      text-decoration: none;

      opacity: 0.74;

      transition:
        opacity 0.25s ease,
        transform 0.25s ease;
    }

    .footer-qr-link:hover {
      opacity: 1;
      transform: translateY(-2px);
    }

    .footer-qr {
      display: block;

      width: 155px;
      height: 155px;

      margin: 0 auto;

      object-fit: contain;

      user-select: none;
      -webkit-user-select: none;
      -webkit-user-drag: none;
    }

    .footer-social-link {
      display: inline-block;

      margin-top: 18px;

      color: #777579;

      font-size: 10px;
      letter-spacing: 2px;

      text-decoration: none;
      text-transform: uppercase;

      transition:
        color 0.2s ease;
    }

    .footer-social-link:hover {
      color: #e1ded8;
    }

    .footer-copyright {
      width: min(900px, 100%);

      margin: 52px auto 0;

      color: #4f4d4b;

      font-size: 9px;
      line-height: 1.4;

      text-align: center;
      letter-spacing: 0.04em;
    }


    /* =====================================================
       RESPONSIVE
       ===================================================== */

    @media (max-width: 600px) {

      .container {
        width: min(900px, 92%);
        padding-top: 38px;
        padding-bottom: 60px;
      }

      h1 {
        margin-bottom: 31px;
        font-size: 34px;
      }

      .album-selector {
        margin-bottom: 28px;
      }

      select {
        height: 45px;
        font-size: 12px;
      }

      .cover-container {
        margin-bottom: 28px;
      }

      audio {
        height: 42px;
        margin-bottom: 27px;
      }

      .now-playing {
        margin-bottom: 32px;
        padding: 16px 15px 17px;
      }

      .now-playing-label {
        font-size: 9px;
        letter-spacing: 2.5px;
      }

      #songTitle {
        font-size: 16px;
      }

      .song {
        padding: 13px 13px;
        font-size: 12px;
      }

      .song:hover,
      .song.active {
        padding-left: 18px;
      }

      .site-footer {
        padding-top: 55px;
        padding-bottom: 20px;
      }

      .footer-logos {
        gap: 42px;
        min-height: 78px;
        margin-bottom: 40px;
        padding: 0 10px;
      }

      .footer-logo {
        height: 62px;
        max-width: 43%;
      }

      .footer-logo:hover {
        transform: scale(1.025);
      }

      .footer-qr {
        width: 125px;
        height: 125px;
      }

      .footer-social-link {
        margin-top: 15px;
        font-size: 9px;
        letter-spacing: 1.7px;
      }

      .footer-copyright {
        margin-top: 42px;
        font-size: 8px;
      }

    }


    @media (max-width: 400px) {

      .container {
        padding-top: 32px;
      }

      h1 {
        font-size: 31px;
      }

      .footer-logos {
        gap: 28px;
      }

      .footer-logo {
        height: 55px;
      }

      .footer-qr {
        width: 115px;
        height: 115px;
      }

    }

  </style>

</head>

  <script>

    /* =====================================================
       CONFIGURACIÓN SUPABASE
       ===================================================== */

    const SUPABASE_URL =
      "https://cavnifartuktwmchyrdl.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_WC_7KWhh6gq-pvL-97D3VA_78DyHmOM";


    const CATALOG_FUNCTION_URL =
      `${SUPABASE_URL}/functions/v1/get-catalog`;

    const AUDIO_FUNCTION_URL =
      `${SUPABASE_URL}/functions/v1/get-audio-url`;

    const REGISTER_PLAY_FUNCTION_URL =
      `${SUPABASE_URL}/functions/v1/register-play`;

    const REGISTER_VISIT_FUNCTION_URL =
      `${SUPABASE_URL}/functions/v1/register-visit`;

    const RRSS_FUNCTION_URL =
      `${SUPABASE_URL}/functions/v1/get-rrss`;


    /* =====================================================
       ELEMENTOS HTML
       ===================================================== */

    const albumSelect =
      document.getElementById("albumSelect");

    const coverImage =
      document.getElementById("coverImage");

    const audioPlayer =
      document.getElementById("audioPlayer");

    const songTitle =
      document.getElementById("songTitle");

    const songList =
      document.getElementById("songList");

    const lnsLogo =
      document.getElementById("lnsLogo");

    const baalLogo =
      document.getElementById("baalLogo");

    const footerQr =
      document.getElementById("footerQr");

    const footerQrLink =
      document.getElementById("footerQrLink");

    const footerSocialLink =
      document.getElementById("footerSocialLink");


    /* =====================================================
       VARIABLES
       ===================================================== */

    let albums = [];

    let currentAlbumIndex = 0;

    let currentSongIndex = 0;


    /* =====================================================
       REGISTRAR VISITA
       ===================================================== */

    async function registerVisit() {

      try {

        const response =
          await fetch(
            REGISTER_VISIT_FUNCTION_URL,
            {
              method: "POST",

              headers: {
                "apikey":
                  SUPABASE_PUBLISHABLE_KEY,

                "Content-Type":
                  "application/json"
              },

              body:
                JSON.stringify({})
            }
          );


        const result =
          await response.json();


        if (!response.ok) {

          throw new Error(
            result.error ||
            "No se pudo registrar la visita."
          );

        }


        console.log(
          "Visita registrada."
        );


      } catch (error) {

        /*
          Un fallo de estadísticas
          nunca debe impedir que
          la web continúe cargando.
        */

        console.error(
          "Error registrando visita:",
          error
        );

      }

    }


    /* =====================================================
       OBTENER CATÁLOGO
       ===================================================== */

    async function loadCatalog() {

      try {

        const response =
          await fetch(
            CATALOG_FUNCTION_URL,
            {
              method: "POST",

              headers: {
                "apikey":
                  SUPABASE_PUBLISHABLE_KEY,

                "Content-Type":
                  "application/json"
              }
            }
          );


        const result =
          await response.json();


        if (!response.ok) {

          throw new Error(
            result.error ||
            "No se pudo cargar el catálogo."
          );

        }


        albums =
          result.albums || [];


        if (albums.length === 0) {

          throw new Error(
            "No se encontraron álbumes."
          );

        }


        renderAlbumSelector();


        /*
          Seleccionamos automáticamente
          el álbum más reciente.
        */

        selectAlbum(0);


      } catch (error) {

        console.error(
          "Error cargando catálogo:",
          error
        );

      }

    }


    /* =====================================================
       SELECTOR DE ÁLBUMES
       ===================================================== */

    function renderAlbumSelector() {

      albumSelect.innerHTML = "";


      albums.forEach(
        (album, index) => {

          const option =
            document.createElement("option");

          option.value =
            index;

          option.textContent =
            `${album.name} (${album.year})`;

          albumSelect.appendChild(
            option
          );

        }
      );

    }


    /* =====================================================
       CAMBIAR DE ÁLBUM
       ===================================================== */

    function selectAlbum(index) {

      currentAlbumIndex =
        Number(index);

      currentSongIndex = 0;


      albumSelect.value =
        currentAlbumIndex;


      const album =
        albums[currentAlbumIndex];


      renderSongList();


      loadCover(
        album.cover
      );


      /*
        Al seleccionar un álbum,
        comenzamos automáticamente
        por la canción 01.
      */

      playSong(0);

    }


    /* =====================================================
       CAMBIO MANUAL DESDE EL SELECT
       ===================================================== */

    albumSelect.addEventListener(
      "change",
      () => {

        selectAlbum(
          Number(
            albumSelect.value
          )
        );

      }
    );


    /* =====================================================
       MOSTRAR LISTA DE CANCIONES
       ===================================================== */

    function renderSongList() {

      songList.innerHTML = "";


      const album =
        albums[currentAlbumIndex];


      album.songs.forEach(
        (song, index) => {

          const element =
            document.createElement("div");


          element.className =
            "song";


          if (
            index === currentSongIndex
          ) {

            element.classList.add(
              "active"
            );

          }


          element.textContent =
            song.name;


          element.addEventListener(
            "click",
            () => {

              playSong(index);

            }
          );


          songList.appendChild(
            element
          );

        }
      );

    }


    /* =====================================================
       OBTENER PORTADA
       ===================================================== */

    async function loadCover(
      coverPath
    ) {

      if (!coverPath) {

        coverImage.removeAttribute(
          "src"
        );

        return;

      }


      try {

        const response =
          await fetch(
            AUDIO_FUNCTION_URL,
            {
              method: "POST",

              headers: {
                "apikey":
                  SUPABASE_PUBLISHABLE_KEY,

                "Content-Type":
                  "application/json"
              },

              body:
                JSON.stringify({
                  path:
                    coverPath
                })
            }
          );


        const result =
          await response.json();


        if (!response.ok) {

          throw new Error(
            result.error ||
            "No se pudo obtener la portada."
          );

        }


        if (!result.signedUrl) {

          throw new Error(
            "Supabase no devolvió una URL firmada para la portada."
          );

        }


        coverImage.src =
          result.signedUrl;


      } catch (error) {

        console.error(
          "Error cargando portada:",
          error
        );


        coverImage.removeAttribute(
          "src"
        );

      }

    }


    /* =====================================================
       REGISTRAR REPRODUCCIÓN
       ===================================================== */

    async function registerPlay(
      album,
      song
    ) {

      try {

        const response =
          await fetch(
            REGISTER_PLAY_FUNCTION_URL,
            {
              method: "POST",

              headers: {
                "apikey":
                  SUPABASE_PUBLISHABLE_KEY,

                "Content-Type":
                  "application/json"
              },

              body:
                JSON.stringify({
                  album:
                    album,

                  song:
                    song
                })
            }
          );


        const result =
          await response.json();


        if (!response.ok) {

          throw new Error(
            result.error ||
            "No se pudo registrar la reproducción."
          );

        }


        console.log(
          "Reproducción registrada:",
          album,
          song
        );


      } catch (error) {

        /*
          Un fallo de estadísticas
          nunca debe detener la música.
        */

        console.error(
          "Error registrando reproducción:",
          error
        );

      }

    }


    /* =====================================================
       REPRODUCIR CANCIÓN
       ===================================================== */

    async function playSong(
      index
    ) {

      const album =
        albums[currentAlbumIndex];


      const song =
        album.songs[index];


      if (!song) {

        return;

      }


      currentSongIndex =
        index;


      songTitle.textContent =
        song.name;


      renderSongList();


      try {

        /*
          Obtener URL firmada
          para el archivo de audio.
        */

        const response =
          await fetch(
            AUDIO_FUNCTION_URL,
            {
              method: "POST",

              headers: {
                "apikey":
                  SUPABASE_PUBLISHABLE_KEY,

                "Content-Type":
                  "application/json"
              },

              body:
                JSON.stringify({
                  path:
                    song.path
                })
            }
          );


        const result =
          await response.json();


        if (!response.ok) {

          throw new Error(
            result.error ||
            "No se pudo obtener el audio."
          );

        }


        if (!result.signedUrl) {

          throw new Error(
            "Supabase no devolvió una URL firmada."
          );

        }


        /*
          Cargar el audio.
        */

        audioPlayer.src =
          result.signedUrl;


        /*
          Intentar comenzar la reproducción.
        */

        await audioPlayer.play();


        /*
          MUY IMPORTANTE:
          solo llegamos aquí si play()
          se ha iniciado correctamente.

          Por tanto, aquí registramos
          la reproducción.
        */

        await registerPlay(
          album.name,
          song.name
        );


      } catch (error) {

        console.error(
          "Error reproduciendo canción:",
          error
        );

      }

    }


    /* =====================================================
       CUANDO TERMINA UNA CANCIÓN
       ===================================================== */

    audioPlayer.addEventListener(
      "ended",
      () => {

        const album =
          albums[currentAlbumIndex];


        /*
          Todavía quedan canciones
          dentro del álbum.
        */

        if (
          currentSongIndex <
          album.songs.length - 1
        ) {

          playSong(
            currentSongIndex + 1
          );

          return;

        }


        /*
          Última canción del álbum.
          Pasamos al siguiente álbum.
        */

        if (
          currentAlbumIndex <
          albums.length - 1
        ) {

          currentAlbumIndex++;


          currentSongIndex = 0;


          albumSelect.value =
            currentAlbumIndex;


          const nextAlbum =
            albums[currentAlbumIndex];


          renderSongList();


          loadCover(
            nextAlbum.cover
          );


          playSong(0);


          return;

        }


        /*
          Hemos terminado el último
          álbum del catálogo.

          Volvemos al primero.
        */

        currentAlbumIndex = 0;

        currentSongIndex = 0;


        albumSelect.value =
          currentAlbumIndex;


        const firstAlbum =
          albums[0];


        renderSongList();


        loadCover(
          firstAlbum.cover
        );


        playSong(0);

      }
    );


    /* =====================================================
       CARGAR RECURSOS RRSS
       ===================================================== */

    async function loadRRSS() {

      try {

        const response =
          await fetch(
            RRSS_FUNCTION_URL,
            {
              method: "GET",

              headers: {
                "apikey":
                  SUPABASE_PUBLISHABLE_KEY
              }
            }
          );


        const result =
          await response.json();


        if (!response.ok) {

          throw new Error(
            result.error ||
            "No se pudieron obtener los recursos de RRSS."
          );

        }


        if (!result.lnsLogo) {

          throw new Error(
            "No se recibió la URL del logo LNS."
          );

        }


        if (!result.baalLogo) {

          throw new Error(
            "No se recibió la URL del logo Baal."
          );

        }


        if (!res
