<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Leones del Patio</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #111;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    .player {
      width: min(90%, 700px);
      margin: 60px auto;
    }

    h1 {
      margin: 0 0 35px;
      text-align: center;
      font-size: 30px;
      font-weight: normal;
    }

    /* SELECTOR DE ÁLBUM */

    .album-selector {
      width: 100%;
      margin-bottom: 30px;
    }

    .album-selector label {
      display: block;
      margin-bottom: 8px;
      font-size: 13px;
      color: #aaa;
    }

    select {
      width: 100%;
      padding: 12px;
      background: #1c1c1c;
      color: #fff;
      border: 1px solid #444;
      font-size: 15px;
      cursor: pointer;
    }

    select:focus {
      outline: none;
      border-color: #666;
    }

    /* PORTADA */

    .cover {
      width: min(100%, 450px);
      margin: 0 auto 20px;
      aspect-ratio: 1 / 1;
      background: #1c1c1c;
      overflow: hidden;
    }

    .cover img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    /* REPRODUCTOR */

    audio {
      width: 100%;
      margin-bottom: 25px;
    }

    /* NOMBRE DEL ÁLBUM */

    .album-name {
      text-align: center;
      font-size: 20px;
      margin-bottom: 25px;
    }

    /* LISTA DE CANCIONES */

    .songs {
      margin-bottom: 30px;
    }

    .song {
      padding: 11px 12px;
      border-bottom: 1px solid #292929;
      cursor: pointer;
      font-size: 14px;
      transition: background 0.15s ease;
    }

    .song:hover {
      background: #1c1c1c;
    }

    .song.active {
      background: #242424;
    }

    /* ESTADO */

    #status {
      margin-top: 15px;
      text-align: center;
      font-size: 13px;
      color: #999;
    }

  </style>

</head>


<body>

  <main class="player">

    <h1>Leones del Patio</h1>


    <!-- SELECTOR DE ÁLBUM -->

    <div class="album-selector">

      <label for="albumSelect">
        Álbum
      </label>

      <select id="albumSelect">

        <option>
          Cargando discos...
        </option>

      </select>

    </div>


    <!-- PORTADA -->

    <div class="cover">

      <img
        id="coverImage"
        src=""
        alt="Portada del álbum">

    </div>


    <!-- REPRODUCTOR -->

    <audio
      id="audioPlayer"
      controls
      preload="metadata"
      controlslist="nodownload noremoteplayback"
      noremoteplayback>
    </audio>


    <!-- NOMBRE DEL ÁLBUM -->

    <div
      id="albumName"
      class="album-name">
    </div>


    <!-- LISTA DE CANCIONES -->

    <div
      id="songs"
      class="songs">
    </div>


    <!-- ESTADO -->

    <div id="status">
      Cargando catálogo...
    </div>

  </main>


  <script>

    /* =========================================================
       CONFIGURACIÓN
       ========================================================= */

    const SUPABASE_URL =
      "https://cavnifartuktwmchyrdl.supabase.co";


    /*
      IMPORTANTE:
      Sustituye solamente el texto de abajo por tu
      publishable key completa.
    */

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_WC_7KWhh6gq-pvL-97D3VA_78DyHmOM";


    const CATALOG_FUNCTION_URL =
      `${SUPABASE_URL}/functions/v1/get-catalog`;


    const AUDIO_FUNCTION_URL =
      `${SUPABASE_URL}/functions/v1/get-audio-url`;


    /* =========================================================
       ELEMENTOS DE LA INTERFAZ
       ========================================================= */

    const albumSelect =
      document.getElementById("albumSelect");


    const coverImage =
      document.getElementById("coverImage");


    const albumName =
      document.getElementById("albumName");


    const songsContainer =
      document.getElementById("songs");


    const audioPlayer =
      document.getElementById("audioPlayer");


    const status =
      document.getElementById("status");


    /* =========================================================
       VARIABLES DEL CATÁLOGO
       ========================================================= */

    let catalog = null;


    let currentAlbumIndex = 0;


    let currentSongIndex = 0;


    /* =========================================================
       CARGAR CATÁLOGO
       ========================================================= */

    async function loadCatalog() {

      try {

        status.textContent =
          "Cargando catálogo...";


        const response =
          await fetch(
            CATALOG_FUNCTION_URL,
            {
              method: "POST",

              headers: {
                "apikey":
                  SUPABASE_PUBLISHABLE_KEY,

                "Content-Type":
                  "application/json"
              },

              body:
                JSON.stringify({})
            }
          );


        const result =
          await response.json();


        if (!response.ok) {

          throw new Error(
            result.error ||
            "No se pudo cargar el catálogo."
          );

        }


        if (
          !result.albums ||
          !Array.isArray(result.albums) ||
          result.albums.length === 0
        ) {

          throw new Error(
            "No se encontraron discos."
          );

        }


        catalog = result;


        buildAlbumSelector();


        /*
          Seleccionamos automáticamente
          el primer álbum del catálogo.

          Como get-catalog ya los entrega
          ordenados de más reciente a más antiguo,
          el índice 0 es el álbum más reciente.
        */

        selectAlbum(0);


        status.textContent =
          "Catálogo cargado.";


      } catch (error) {

        console.error(error);


        status.textContent =
          "Error: " + error.message;

      }

    }


    /* =========================================================
       CREAR SELECTOR DE ÁLBUMES
       ========================================================= */

    function buildAlbumSelector() {

      albumSelect.innerHTML = "";


      catalog.albums.forEach(
        (album, index) => {

          const option =
            document.createElement("option");


          option.value =
            index;


          /*
            El nombre que devuelve get-catalog
            ya tiene oculto solamente el último
            (01), (02), etc.

            El año permanece visible.
          */

          option.textContent =
            `${album.name} (${album.year})`;


          albumSelect.appendChild(
            option
          );

        }
      );

    }


    /* =========================================================
       SELECCIONAR ÁLBUM
       ========================================================= */

    function selectAlbum(index) {

      currentAlbumIndex =
        index;


      currentSongIndex =
        0;


      const album =
        catalog.albums[
          currentAlbumIndex
        ];


      albumSelect.value =
        currentAlbumIndex;


      albumName.textContent =
        `${album.name} (${album.year})`;


      /*
        La portada todavía no se carga.

        Esto es intencionado porque el bucket
        musicpriv es privado.

        Más adelante generaremos una URL firmada
        también para la portada.
      */

      coverImage.removeAttribute(
        "src"
      );


      buildSongList();


      /*
        Al cambiar manualmente de álbum,
        dejamos el reproductor preparado
        pero no iniciamos todavía la canción.

        El comportamiento de reproducción
        automática al seleccionar álbum lo
        añadiremos después.
      */

      audioPlayer.pause();


      audioPlayer.removeAttribute(
        "src"
      );


      audioPlayer.load();


      status.textContent =
        "Álbum seleccionado.";

    }


    /* =========================================================
       CREAR LISTA DE CANCIONES
       ========================================================= */

    function buildSongList() {

      songsContainer.innerHTML =
        "";


      const album =
        catalog.albums[
          currentAlbumIndex
        ];


      album.songs.forEach(
        (song, index) => {

          const element =
            document.createElement("div");


          element.className =
            "song";


          element.textContent =
            song.name;


          element.addEventListener(
            "click",
            () => {

              playSong(index);

            }
          );


          songsContainer.appendChild(
            element
          );

        }
      );


      updateActiveSong();

    }


    /* =========================================================
       REPRODUCIR CANCIÓN
       ========================================================= */

    async function playSong(index) {

      const album =
        catalog.albums[
          currentAlbumIndex
        ];


      const song =
        album.songs[index];


      currentSongIndex =
        index;


      try {

        status.textContent =
          "Obteniendo audio...";


        const response =
          await fetch(
            AUDIO_FUNCTION_URL,
            {
              method: "POST",

              headers: {
                "apikey":
                  SUPABASE_PUBLISHABLE_KEY,

                "Content-Type":
                  "application/json"
              },

              body:
                JSON.stringify({
                  path: song.path
                })
            }
          );


        const result =
          await response.json();


        if (!response.ok) {

          throw new Error(
            result.error ||
            "No se pudo obtener el audio."
          );

        }


        if (!result.signedUrl) {

          throw new Error(
            "Supabase no devolvió una URL firmada."
          );

        }


        /*
          Cargamos la URL temporal
          del archivo privado.
        */

        audioPlayer.src =
          result.signedUrl;


        updateActiveSong();


        status.textContent =
          "Reproduciendo.";


        /*
          Intentamos iniciar la reproducción.

          Si el navegador lo bloquea, la
          promesa fallará y dejamos que el
          usuario pueda pulsar Play manualmente.
        */

        try {

          await audioPlayer.play();

        } catch (playError) {

          console.warn(
            "La reproducción automática fue bloqueada:",
            playError
          );


          status.textContent =
            "Pulsa Play para reproducir.";

        }


      } catch (error) {

        console.error(error);


        status.textContent =
          "Error: " + error.message;

      }

    }


    /* =========================================================
       MARCAR CANCIÓN ACTIVA
       ========================================================= */

    function updateActiveSong() {

      const songs =
        document.querySelectorAll(
          ".song"
        );


      songs.forEach(
        (element, index) => {

          element.classList.toggle(
            "active",
            index === currentSongIndex
          );

        }
      );

    }


    /* =========================================================
       CAMBIO MANUAL DE ÁLBUM
       ========================================================= */

    albumSelect.addEventListener(
      "change",
      () => {

        const index =
          Number(
            albumSelect.value
          );


        selectAlbum(index);

      }
    );


    /* =========================================================
       REPRODUCCIÓN AUTOMÁTICA SECUENCIAL
       ========================================================= */

    audioPlayer.addEventListener(
      "ended",
      () => {

        /*
          Obtenemos el álbum actual.
        */

        const album =
          catalog.albums[
            currentAlbumIndex
          ];


        /*
          -----------------------------------------------------
          CASO 1
          Todavía quedan canciones dentro
          del álbum actual.
          -----------------------------------------------------
        */

        if (
          currentSongIndex <
          album.songs.length - 1
        ) {

          playSong(
            currentSongIndex + 1
          );


          return;

        }


        /*
          -----------------------------------------------------
          CASO 2
          Hemos terminado el álbum actual.

          Comprobamos si existe otro álbum.
          -----------------------------------------------------
        */

        if (
          currentAlbumIndex <
          catalog.albums.length - 1
        ) {

          currentAlbumIndex++;


          currentSongIndex =
            0;


          const nextAlbum =
            catalog.albums[
              currentAlbumIndex
            ];


          /*
            Actualizamos el selector.
          */

          albumSelect.value =
            currentAlbumIndex;


          /*
            Actualizamos el nombre.
          */

          albumName.textContent =
            `${nextAlbum.name} (${nextAlbum.year})`;


          /*
            La portada continúa pendiente
            de implementar.
          */

          coverImage.removeAttribute(
            "src"
          );


          /*
            Construimos la nueva lista.
          */

          buildSongList();


          /*
            Reproducimos automáticamente
            el primer tema del nuevo álbum.
          */

          playSong(0);


          return;

        }


        /*
          -----------------------------------------------------
          CASO 3
          Hemos terminado el último tema
          del último álbum.

          Volvemos al primer álbum.
          -----------------------------------------------------
        */

        currentAlbumIndex =
          0;


        currentSongIndex =
          0;


        const firstAlbum =
          catalog.albums[
            currentAlbumIndex
          ];


        /*
          Actualizamos selector.
        */

        albumSelect.value =
          currentAlbumIndex;


        /*
          Actualizamos nombre.
        */

        albumName.textContent =
          `${firstAlbum.name} (${firstAlbum.year})`;


        /*
          Portada pendiente.
        */

        coverImage.removeAttribute(
          "src"
        );


        /*
          Reconstruimos lista.
        */

        buildSongList();


        /*
          Volvemos al primer tema.
        */

        playSong(0);

      }
    );


    /* =========================================================
       INICIAR
       ========================================================= */

    loadCatalog();

  </script>

</body>

</html>
