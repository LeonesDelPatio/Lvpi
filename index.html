<!DOCTYPE html>

<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Lvpi</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: #000;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    main {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      padding: 42px 24px 0;
      flex: 1;
    }

    h1 {
      margin: 0 0 38px;
      text-align: center;
      font-size: 32px;
      font-weight: 500;
      letter-spacing: 0.08em;
    }

    .album-selector {
      display: flex;
      justify-content: center;
      margin-bottom: 34px;
    }

    #albumSelect {
      width: min(100%, 520px);
      padding: 12px 16px;
      border: 1px solid #333;
      border-radius: 4px;
      background: #0b0b0b;
      color: #fff;
      font-size: 14px;
      outline: none;
    }

    #albumSelect:focus {
      border-color: #666;
    }

    .album-container {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    #cover {
      display: block;
      width: min(100%, 420px);
      height: auto;
      max-height: 420px;
      object-fit: contain;
      margin: 0 auto 30px;
      user-select: none;
      -webkit-user-drag: none;
      border-radius: 2px;
    }

    .player {
      width: min(100%, 760px);
      margin: 0 auto;
    }

    audio {
      display: block;
      width: 100%;
      margin-bottom: 28px;
    }

    #songList {
      width: 100%;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    #songList li {
      padding: 11px 14px;
      border-bottom: 1px solid #1d1d1d;
      color: #bbb;
      font-size: 14px;
      cursor: pointer;
      transition:
        color 0.15s ease,
        background 0.15s ease;
    }

    #songList li:first-child {
      border-top: 1px solid #1d1d1d;
    }

    #songList li:hover {
      color: #fff;
      background: #0b0b0b;
    }

    #songList li.active {
      color: #fff;
      background: #111;
    }

    /* =========================================================
       FOOTER
       ========================================================= */

    footer {
      width: 100%;
      margin-top: 92px;
      padding: 0 24px 26px;
    }

    .footer-inner {
      width: min(100%, 1100px);
      margin: 0 auto;
    }

    .footer-identity {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 72px;
      min-height: 105px;
    }

    .footer-logo {
      display: block;
      width: auto;
      height: 88px;
      max-width: 300px;
      object-fit: contain;
      opacity: 0.76;
      user-select: none;
      -webkit-user-drag: none;
      transition: opacity 0.2s ease;
    }

    .footer-logo:hover {
      opacity: 0.95;
    }

    .footer-social {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-top: 42px;
    }

    .footer-qr-link {
      display: block;
      line-height: 0;
      text-decoration: none;
    }

    .footer-qr {
      display: block;
      width: 155px;
      height: 155px;
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
      opacity: 0.9;
      transition: opacity 0.2s ease;
    }

    .footer-qr-link:hover .footer-qr {
      opacity: 1;
    }

    .footer-link {
      display: inline-block;
      margin-top: 17px;
      color: #aaa;
      text-decoration: none;
      font-size: 12px;
      letter-spacing: 0.08em;
      transition: color 0.2s ease;
    }

    .footer-link:hover {
      color: #fff;
    }

    .footer-bottom {
      display: flex;
      justify-content: flex-end;
      margin-top: 50px;
    }

    .footer-copyright {
      margin: 0;
      color: #555;
      font-size: 10px;
      line-height: 1.5;
      letter-spacing: 0.02em;
      text-align: right;
    }

    @media (max-width: 700px) {
      main {
        padding: 30px 16px 0;
      }

      h1 {
        margin-bottom: 30px;
        font-size: 28px;
      }

      #cover {
        margin-bottom: 24px;
      }

      footer {
        margin-top: 70px;
        padding: 0 16px 22px;
      }

      .footer-identity {
        gap: 34px;
        min-height: 75px;
      }

      .footer-logo {
        height: 62px;
        max-width: 42%;
      }

      .footer-social {
        margin-top: 34px;
      }

      .footer-qr {
        width: 125px;
        height: 125px;
      }

      .footer-bottom {
        justify-content: center;
        margin-top: 38px;
      }

      .footer-copyright {
        text-align: center;
        font-size: 9px;
      }
    }

    @media (max-width: 430px) {
      .footer-identity {
        gap: 24px;
      }

      .footer-logo {
        height: 54px;
      }

      .footer-qr {
        width: 115px;
        height: 115px;
      }
    }
  </style>

</head>

  </footer>

  <script>
    const SUPABASE_URL =
      "https://cavnifartuktwmchyrdl.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_WC_7KWhh6gq-pvL-97D3VA_78DyHmOM";

    const CATALOG_FUNCTION_URL =
      SUPABASE_URL + "/functions/v1/get-catalog";

    const AUDIO_FUNCTION_URL =
      SUPABASE_URL + "/functions/v1/get-audio-url";

    const REGISTER_PLAY_FUNCTION_URL =
      SUPABASE_URL + "/functions/v1/register-play";

    const REGISTER_VISIT_FUNCTION_URL =
      SUPABASE_URL + "/functions/v1/register-visit";

    const RRSS_FUNCTION_URL =
      SUPABASE_URL + "/functions/v1/get-rrss";


    const albumSelect =
      document.getElementById("albumSelect");

    const cover =
      document.getElementById("cover");

    const audioPlayer =
      document.getElementById("audioPlayer");

    const songList =
      document.getElementById("songList");

    const lnsLogo =
      document.getElementById("lnsLogo");

    const baalLogo =
      document.getElementById("baalLogo");

    const qrImage =
      document.getElementById("qrImage");

    const qrLink =
      document.getElementById("qrLink");

    const rrssLink =
      document.getElementById("rrssLink");


    let albums = [];

    let currentAlbumIndex = -1;

    let currentSongIndex = -1;


    async function registerVisit() {

      try {

        await fetch(
          REGISTER_VISIT_FUNCTION_URL,
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "apikey": SUPABASE_PUBLISHABLE_KEY
            }
          }
        );

      } catch (error) {

        console.error(
          "Error registrando visita:",
          error
        );

      }

    }


    async function loadCatalog() {

      try {

        const response =
          await fetch(
            CATALOG_FUNCTION_URL,
            {
              headers: {
                "apikey":
                  SUPABASE_PUBLISHABLE_KEY
              }
            }
          );

        if (!response.ok) {

          throw new Error(
            "No se pudo cargar el catálogo."
          );

        }

        albums =
          await response.json();

        renderAlbumSelector();

        if (albums.length > 0) {

          selectAlbum(0);

        }

      } catch (error) {

        console.error(
          "Error cargando catálogo:",
          error
        );

      }

    }


    function renderAlbumSelector() {

      albumSelect.innerHTML =
        '<option value="">Selecciona un álbum</option>';

      albums.forEach(
        (album, index) => {

          const option =
            document.createElement("option");

          option.value = index;

          option.textContent =
            album.displayName;

          albumSelect.appendChild(
            option
          );

        }
      );

    }


    async function selectAlbum(index) {

      if (
        index < 0 ||
        index >= albums.length
      ) {

        return;

      }

      currentAlbumIndex = index;

      currentSongIndex = -1;

      albumSelect.value = index;

      const album =
        albums[index];

      audioPlayer.pause();

      audioPlayer.removeAttribute("src");

      audioPlayer.load();

      loadCover(album);

      renderSongList(album);

    }


    albumSelect.addEventListener(
      "change",
      () => {

        const value =
          albumSelect.value;

        if (value === "") {

          return;

        }

        selectAlbum(
          Number(value)
        );

      }
    );


    function renderSongList(album) {

      songList.innerHTML = "";

      if (
        !album ||
        !Array.isArray(album.songs)
      ) {

        return;

      }

      album.songs.forEach(
        (song, index) => {

          const li =
            document.createElement("li");

          li.textContent =
            song.name;

          li.addEventListener(
            "click",
            () => {

              playSong(index);

            }
          );

          songList.appendChild(li);

        }
      );

    }


    async function loadCover(album) {

      cover.removeAttribute("src");

      cover.alt =
        album.displayName || "";

      if (!album.cover) {

        return;

      }

      try {

        const response =
          await fetch(
            AUDIO_FUNCTION_URL,
            {
              method: "POST",
              headers: {
                "Content-Type":
                  "application/json",
                "apikey":
                  SUPABASE_PUBLISHABLE_KEY
              },
              body: JSON.stringify({
                album:
                  album.folder,
                song:
                  album.cover
              })
            }
          );

        if (!response.ok) {

          throw new Error(
            "No se pudo obtener la carátula."
          );

        }

        const data =
          await response.json();

        if (data.url) {

          cover.src =
            data.url;

        }

      } catch (error) {

        console.error(
          "Error cargando carátula:",
          error
        );

      }

    }


    async function registerPlay(
      album,
      song
    ) {

      try {

        await fetch(
          REGISTER_PLAY_FUNCTION_URL,
          {
            method: "POST",
            headers: {
              "Content-Type":
                "application/json",
              "apikey":
                SUPABASE_PUBLISHABLE_KEY
            },
            body: JSON.stringify({
              album,
              song
            })
          }
        );

      } catch (error) {

        console.error(
          "Error registrando reproducción:",
          error
        );

      }

    }


    async function playSong(index) {

      if (
        currentAlbumIndex < 0 ||
        currentAlbumIndex >= albums.length
      ) {

        return;

      }

      const album =
        albums[currentAlbumIndex];

      if (
        !album.songs ||
        index < 0 ||
        index >= album.songs.length
      ) {

        return;

      }

      const song =
        album.songs[index];

      currentSongIndex = index;

      Array.from(
        songList.children
      ).forEach(
        (item, itemIndex) => {

          item.classList.toggle(
            "active",
            itemIndex === index
          );

        }
      );

      try {

        const response =
          await fetch(
            AUDIO_FUNCTION_URL,
            {
              method: "POST",
              headers: {
                "Content-Type":
                  "application/json",
                "apikey":
                  SUPABASE_PUBLISHABLE_KEY
              },
              body: JSON.stringify({
                album:
                  album.folder,
                song:
                  song.name
              })
            }
          );

        if (!response.ok) {

          throw new Error(
            "No se pudo obtener el audio."
          );

        }

        const data =
          await response.json();

        if (!data.url) {

          throw new Error(
            "La función no devolvió una URL."
          );

        }

        audioPlayer.src =
          data.url;

        audioPlayer.currentTime = 0;

        await audioPlayer.play();

        registerPlay(
          album.folder,
          song.name
        );

      } catch (error) {

        console.error(
          "Error reproduciendo canción:",
          error
        );

      }

    }


    audioPlayer.addEventListener(
      "ended",
      () => {

        if (
          currentAlbumIndex < 0 ||
          currentAlbumIndex >= albums.length
        ) {

          return;

        }

        const album =
          albums[currentAlbumIndex];

        const nextSongIndex =
          currentSongIndex + 1;

        if (
          nextSongIndex <
          album.songs.length
        ) {

          playSong(
            nextSongIndex
          );

          return;

        }

        const nextAlbumIndex =
          currentAlbumIndex + 1;

        if (
          nextAlbumIndex <
          albums.length
        ) {

          selectAlbum(
            nextAlbumIndex
          );

          if (
            albums[nextAlbumIndex].songs &&
            albums[nextAlbumIndex].songs.length > 0
          ) {

            playSong(0);

          }

          return;

        }

        if (
          albums.length > 0 &&
          albums[0].songs &&
          albums[0].songs.length > 0
        ) {

          selectAlbum(0);

          playSong(0);

        }

      }
    );


    async function loadRRSS() {

      try {

        const response =
          await fetch(
            RRSS_FUNCTION_URL,
            {
              method: "GET",
              headers: {
                "apikey":
                  SUPABASE_PUBLISHABLE_KEY
              }
            }
          );

        if (!response.ok) {

          throw new Error(
            "No se pudieron cargar los recursos de RRSS."
          );

        }

        const data =
          await response.json();

        if (data.lnsLogo) {

          lnsLogo.src =
            data.lnsLogo;

        }

        if (data.baalLogo) {

          baalLogo.src =
            data.baalLogo;

        }

        if (data.qr) {

          qrImage.src =
            data.qr;

        }

        if (data.linktree) {

          qrLink.href =
            data.linktree;

          rrssLink.href =
            data.linktree;

        }

      } catch (error) {

        console.error(
          "Error cargando RRSS:",
          error
        );

      }

    }


    document.addEventListener(
      "contextmenu",
      (event) => {

        if (
          event.target.tagName === "IMG"
        ) {

          event.preventDefault();

        }

      }
    );


    document.addEventListener(
      "dragstart",
      (event) => {

        if (
          event.target.tagName === "IMG"
        ) {

          event.preventDefault();

        }

      }
    );


    registerVisit();

    loadCatalog();

    loadRRSS();

  </script>

</body>
