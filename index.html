<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Lvpi</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #151719;
      color: #eeeae5;
      font-family: Arial, Helvetica, sans-serif;
    }

    .lion-background {
      position: fixed;
      top: 50%;
      left: 50%;
      width: min(1180px, 100vw);
      height: auto;
      transform: translate(-50%, -50%);
      opacity: 0.12;
      z-index: 0;
      pointer-events: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-user-drag: none;
    }

    .container,
    .site-footer {
      position: relative;
      z-index: 1;
    }

    .container {
      width: min(900px, 92%);
      margin: 0 auto;
      padding: 52px 0 70px;
      text-align: center;
    }

    h1 {
      margin: 0 0 34px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 34px;
      font-weight: 400;
      letter-spacing: 0.055em;
      color: #eee9e3;
    }

    /* Scrollbars integradas con la paleta de la interfaz */
    html {
      scrollbar-color: #4a4d4f #151719;
      scrollbar-width: thin;
    }

    body::-webkit-scrollbar,
    .custom-select-menu::-webkit-scrollbar {
      width: 9px;
    }

    body::-webkit-scrollbar-track,
    .custom-select-menu::-webkit-scrollbar-track {
      background: #151719;
    }

    body::-webkit-scrollbar-thumb,
    .custom-select-menu::-webkit-scrollbar-thumb {
      background: #4a4d4f;
      border: 2px solid #151719;
      border-radius: 999px;
    }

    body::-webkit-scrollbar-thumb:hover,
    .custom-select-menu::-webkit-scrollbar-thumb:hover {
      background: #5b5e60;
    }

    .album-selector {
      margin-bottom: 34px;
    }

    .album-select-native {
      display: none;
    }

    .custom-select {
      position: relative;
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
      text-align: left;
    }

    .custom-select-button {
      width: 100%;
      min-height: 46px;
      padding: 13px 44px 13px 15px;
      background: #1b1d1f;
      color: #e8e1da;
      border: 1px solid #393b3d;
      border-radius: 7px;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 14px;
      letter-spacing: 0.015em;
      text-align: left;
      cursor: pointer;
      outline: none;
      position: relative;
      transition:
        background 0.18s ease,
        border-color 0.18s ease;
    }

    .custom-select-button::after {
      content: "";
      position: absolute;
      right: 17px;
      top: 50%;
      width: 7px;
      height: 7px;
      border-right: 1px solid #aaa5a0;
      border-bottom: 1px solid #aaa5a0;
      transform: translateY(-70%) rotate(45deg);
      pointer-events: none;
      transition: transform 0.18s ease;
    }

    .custom-select.open .custom-select-button,
    .custom-select-button:focus {
      border-color: #5a5c5e;
      background: #202224;
    }

    .custom-select.open .custom-select-button::after {
      transform: translateY(-25%) rotate(225deg);
    }

    .custom-select-menu {
      position: absolute;
      z-index: 20;
      top: calc(100% + 7px);
      left: 0;
      width: 100%;
      max-height: 300px;
      overflow-y: auto;
      padding: 5px;
      background: #1b1d1f;
      border: 1px solid #393b3d;
      border-radius: 7px;
      box-shadow: 0 14px 30px rgba(0, 0, 0, 0.28);
      display: none;
    }

    .custom-select.open .custom-select-menu {
      display: block;
    }

    .custom-select-option {
      width: 100%;
      padding: 11px 12px;
      border: 0;
      border-radius: 5px;
      background: transparent;
      color: #d8d2cc;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 14px;
      letter-spacing: 0.01em;
      text-align: left;
      cursor: pointer;
      transition:
        background 0.15s ease,
        color 0.15s ease;
    }

    .custom-select-option:hover,
    .custom-select-option.active {
      background: #292c2e;
      color: #f0ebe5;
    }

    .cover-container {
      width: min(500px, 90%);
      margin: 0 auto 28px;
    }

    .cover-container img {
      display: block;
      width: 100%;
      height: auto;
      border: 1px solid #36393b;
      border-radius: 6px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.22);
    }

    audio {
      display: none;
    }

    .custom-player {
      width: min(700px, 100%);
      margin: 0 auto 27px;
      padding: 11px 13px;
      display: grid;
      grid-template-columns: 40px 40px minmax(0, 1fr) 76px 40px;
      grid-template-rows: 30px 22px;
      column-gap: 8px;
      row-gap: 4px;
      align-items: center;
      background: #1b1d1f;
      border: 1px solid #393b3d;
      border-radius: 7px;
    }

    .player-button {
      width: 40px;
      height: 30px;
      padding: 0;
      border: 1px solid #3b3e40;
      border-radius: 5px;
      background: transparent;
      color: #c8c8c5;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 17px;
      line-height: 1;
      cursor: pointer;
      transition:
        background 0.18s ease,
        color 0.18s ease,
        border-color 0.18s ease;
    }

    .player-button:hover {
      background: #292c2e;
      color: #f0efec;
      border-color: #55585a;
    }

    .player-button:active {
      background: #303335;
    }

    .player-progress {
      width: 100%;
      height: 4px;
      margin: 0;
      appearance: none;
      -webkit-appearance: none;
      border-radius: 999px;
      background: #3a3d3f;
      cursor: pointer;
      outline: none;
    }

    .player-progress::-webkit-slider-thumb,
    .player-volume::-webkit-slider-thumb {
      appearance: none;
      -webkit-appearance: none;
      width: 10px;
      height: 10px;
      border: 0;
      border-radius: 50%;
      background: #c8c3bd;
      cursor: pointer;
    }

    .player-progress::-moz-range-thumb,
    .player-volume::-moz-range-thumb {
      width: 10px;
      height: 10px;
      border: 0;
      border-radius: 50%;
      background: #c8c3bd;
      cursor: pointer;
    }

    .player-time {
      grid-column: 3;
      color: #817b75;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 9px;
      letter-spacing: 0.04em;
      text-align: left;
      white-space: nowrap;
    }

    .player-volume-wrap {
      grid-column: 4;
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }

    .player-volume-icon {
      color: #89847f;
      font-size: 11px;
      line-height: 1;
      user-select: none;
    }

    .player-volume {
      width: 55px;
      height: 4px;
      margin: 0;
      appearance: none;
      -webkit-appearance: none;
      border-radius: 999px;
      background: #3a3d3f;
      cursor: pointer;
      outline: none;
    }

    .player-next {
      grid-column: 5;
      grid-row: 1;
    }

    .player-previous {
      grid-column: 1;
      grid-row: 1;
    }

    .player-play {
      grid-column: 2;
      grid-row: 1;
      font-size: 15px;
    }

    .now-playing {
      margin: 11px auto 32px;
      text-align: center;
      max-width: 750px;
    }

    .now-playing-label {
      display: block;
      margin-bottom: 8px;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 2.8px;
      color: #8f857c;
    }

    #songTitle {
      display: block;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 18px;
      line-height: 1.5;
      letter-spacing: 0.015em;
      color: #eee8e1;
    }

    .songs {
      width: min(750px, 100%);
      margin: 0 auto;
      text-align: left;
      background: #1b1d1f;
      border: 1px solid #393b3d;
      border-radius: 7px;
      overflow: hidden;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.12);
    }

    .song {
      padding: 13px 15px;
      border-bottom: 1px solid #303336;
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease;
      color: #d5cec7;
      letter-spacing: 0.01em;
    }

    .song:last-child {
      border-bottom: 0;
    }

    .song:hover {
      background: #25282a;
      color: #f0ebe5;
    }

    .song.active {
      background: #2b2e30;
      color: #f2ece5;
    }


    /* =====================================================
       FOOTER
       ===================================================== */

    .site-footer {
      width: 100%;
      margin-top: 62px;
      padding: 72px 20px 25px;
      border-top: 1px solid #2b2e30;
      text-align: center;
    }

    .footer-content {
      width: min(900px, 100%);
      margin: 0 auto;
    }

    .footer-logos {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 95px;
      min-height: 120px;
      margin: 0 auto 55px;
      padding: 0 20px;
    }

    .footer-logo {
      display: block;
      width: auto;
      height: 88px;
      max-width: 310px;
      object-fit: contain;
      opacity: 0.58;
      user-select: none;
      -webkit-user-select: none;
      -webkit-user-drag: none;
      pointer-events: auto;
      transition:
        opacity 0.25s ease,
        transform 0.25s ease;
    }

    .footer-logo:hover {
      opacity: 0.95;
      transform: scale(1.035);
    }

    .footer-qr-link {
      display: block;
      width: fit-content;
      margin: 0 auto;
      line-height: 0;
      text-decoration: none;
    }

    .footer-qr {
      display: block;
      width: 155px;
      height: 155px;
      margin: 0 auto;
      object-fit: contain;
      user-select: none;
      -webkit-user-select: none;
      -webkit-user-drag: none;
    }

    .footer-social-link {
      display: inline-block;
      margin-top: 18px;
      color: #8e847b;
      font-size: 11px;
      letter-spacing: 1.8px;
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .footer-social-link:hover {
      color: #eee8e1;
    }

    .footer-copyright {
      width: min(900px, 100%);
      margin: 52px auto 0;
      color: #5f5852;
      font-size: 10px;
      line-height: 1.4;
      text-align: center;
      letter-spacing: 0.02em;
    }


    /* =====================================================
       RESPONSIVE
       ===================================================== */

    @media (max-width: 600px) {

      .container {
        padding-top: 30px;
      }

      h1 {
        font-size: 28px;
        margin-bottom: 29px;
      }

      #songTitle {
        font-size: 16px;
      }

      .lion-background {
        width: 135vw;
        opacity: 0.12;
      }

      .custom-player {
        grid-template-columns: 34px 34px minmax(0, 1fr) 65px 34px;
        column-gap: 6px;
        padding: 10px 8px;
      }

      .player-button {
        width: 34px;
        height: 30px;
      }

      .player-volume {
        width: 44px;
      }

      .song {
        padding: 12px 11px;
      }

      .site-footer {
        margin-top: 45px;
        padding-top: 55px;
        padding-bottom: 18px;
      }

      .footer-logos {
        gap: 42px;
        min-height: 78px;
        margin-bottom: 40px;
        padding: 0 10px;
      }

      .footer-logo {
        height: 62px;
        max-width: 43%;
      }

      .footer-logo:hover {
        transform: scale(1.025);
      }

      .footer-qr {
        width: 125px;
        height: 125px;
      }

      .footer-social-link {
        margin-top: 15px;
      }

      .footer-copyright {
        margin-top: 42px;
        text-align: center;
        font-size: 9px;
      }

    }


    @media (max-width: 400px) {

      .footer-logos {
        gap: 28px;
      }

      .footer-logo {
        height: 55px;
      }

      .footer-qr {
        width: 115px;
        height: 115px;
      }

    }

  </style>
</head>

<body>

  <img
    id="lionBackground"
    class="lion-background"
    alt=""
    aria-hidden="true"
    draggable="false"
  >

  <script>
    document.addEventListener("contextmenu", (event) => {
      event.preventDefault();
    });
  </script>

  <div class="container">

    <h1>Lvpi</h1>

    <div class="album-selector">

      <select
        id="albumSelect"
        class="album-select-native"
        aria-hidden="true"
        tabindex="-1"
      ></select>

      <div
        id="customAlbumSelect"
        class="custom-select"
      >

        <button
          id="customAlbumSelectButton"
          class="custom-select-button"
          type="button"
          aria-haspopup="listbox"
          aria-expanded="false"
        >
          Seleccionar álbum
        </button>

        <div
          id="customAlbumSelectMenu"
          class="custom-select-menu"
          role="listbox"
        ></div>

      </div>

    </div>

    <div class="cover-container">
      <img
        id="coverImage"
        alt="Portada del álbum"
      >
    </div>

    <audio
      id="audioPlayer"
      preload="metadata"
    ></audio>

    <div
      class="custom-player"
      aria-label="Reproductor de audio"
    >

      <button
        id="previousSongButton"
        class="player-button player-previous"
        type="button"
        aria-label="Canción anterior"
        title="Canción anterior"
      >‹</button>

      <button
        id="playPauseButton"
        class="player-button player-play"
        type="button"
        aria-label="Reproducir"
        title="Reproducir"
      >▶</button>

      <button
        id="nextSongButton"
        class="player-button player-next"
        type="button"
        aria-label="Siguiente canción"
        title="Siguiente canción"
      >›</button>

      <input
        id="playerProgress"
        class="player-progress"
        type="range"
        min="0"
        max="100"
        value="0"
        step="0.1"
        aria-label="Progreso de la canción"
      >

      <div class="player-volume-wrap">

        <span
          class="player-volume-icon"
          aria-hidden="true"
        >◖</span>

        <input
          id="playerVolume"
          class="player-volume"
          type="range"
          min="0"
          max="1"
          value="1"
          step="0.01"
          aria-label="Volumen"
        >

      </div>

      <div
        id="playerTime"
        class="player-time"
      >0:00 / 0:00</div>

    </div>

    <div class="now-playing">

      <span class="now-playing-label">
        Reproduciendo
      </span>

      <span id="songTitle">
        Ninguna canción
      </span>

    </div>

    <div
      id="songList"
      class="songs"
    ></div>

  </div>


  <footer class="site-footer">

    <div class="footer-content">

      <div class="footer-logos">

        <img
          id="lnsLogo"
          class="footer-logo"
          alt="Leones del Patio"
          draggable="false"
        >

        <img
          id="baalLogo"
          class="footer-logo"
          alt="Baal"
          draggable="false"
        >

      </div>

      <a
        id="footerQrLink"
        class="footer-qr-link"
        href="https://linktr.ee/LvpiAKAJohnOPerdono"
        target="_blank"
        rel="noopener noreferrer"
      >
        <img
          id="footerQr"
          class="footer-qr"
          alt="QR para redes sociales"
          draggable="false"
        >
      </a>

      <a
        id="footerSocialLink"
        class="footer-social-link"
        href="https://linktr.ee/LvpiAKAJohnOPerdono"
        target="_blank"
        rel="noopener noreferrer"
      >
        Click para RRSS
      </a>

    </div>

    <div class="footer-copyright">
      © Todos los derechos reservados para Lvpi y Leones del Patio
    </div>

  </footer>


  <script>

    /* =====================================================
       CONFIGURACIÓN SUPABASE
       ===================================================== */

    const SUPABASE_URL =
      "https://cavnifartuktwmchyrdl.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_WC_7KWhh6gq-pvL-97D3VA_78DyHmOM";


    const CATALOG_FUNCTION_URL =
      `${SUPABASE_URL}/functions/v1/get-catalog`;

    const AUDIO_FUNCTION_URL =
      `${SUPABASE_URL}/functions/v1/get-audio-url`;

    const REGISTER_PLAY_FUNCTION_URL =
      `${SUPABASE_URL}/functions/v1/register-play`;

    const REGISTER_VISIT_FUNCTION_URL =
      `${SUPABASE_URL}/functions/v1/register-visit`;

    const RRSS_FUNCTION_URL =
      `${SUPABASE_URL}/functions/v1/get-rrss`;


    const RRSS_FUNCTION_URL =
      `${SUPABASE_URL}/functions/v1/get-fondo`;
    

    /* =====================================================
       ELEMENTOS HTML
       ===================================================== */

    const albumSelect =
      document.getElementById("albumSelect");

    const customAlbumSelect =
      document.getElementById("customAlbumSelect");

    const customAlbumSelectButton =
      document.getElementById("customAlbumSelectButton");

    const customAlbumSelectMenu =
      document.getElementById("customAlbumSelectMenu");

    const coverImage =
      document.getElementById("coverImage");

    const audioPlayer =
      document.getElementById("audioPlayer");

    const previousSongButton =
      document.getElementById("previousSongButton");

    const nextSongButton =
      document.getElementById("nextSongButton");

    const playPauseButton =
      document.getElementById("playPauseButton");

    const playerProgress =
      document.getElementById("playerProgress");

    const playerVolume =
      document.getElementById("playerVolume");

    const playerTime =
      document.getElementById("playerTime");

    const lionBackground =
      document.getElementById("lionBackground");

    const songTitle =
      document.getElementById("songTitle");

    const songList =
      document.getElementById("songList");

    const lnsLogo =
      document.getElementById("lnsLogo");

    const baalLogo =
      document.getElementById("baalLogo");

    const footerQr =
      document.getElementById("footerQr");

    const footerQrLink =
      document.getElementById("footerQrLink");

    const footerSocialLink =
      document.getElementById("footerSocialLink");


    /* =====================================================
       VARIABLES
       ===================================================== */

    let albums = [];

    let currentAlbumIndex = 0;

    let currentSongIndex = 0;


    /* =====================================================
       REGISTRAR VISITA
       ===================================================== */

    async function registerVisit() {

      try {

        const response =
          await fetch(
            REGISTER_VISIT_FUNCTION_URL,
            {
              method: "POST",

              headers: {
                "apikey":
                  SUPABASE_PUBLISHABLE_KEY,

                "Content-Type":
                  "application/json"
              },

              body:
                JSON.stringify({})
            }
          );


        const result =
          await response.json();


        if (!response.ok) {

          throw new Error(
            result.error ||
            "No se pudo registrar la visita."
          );

        }


        console.log(
          "Visita registrada."
        );


      } catch (error) {

        /*
          Un fallo de estadísticas
          nunca debe impedir que
          la web continúe cargando.
        */

        console.error(
          "Error registrando visita:",
          error
        );

      }

    }


    /* =====================================================
       OBTENER CATÁLOGO
       ===================================================== */

    async function loadCatalog() {

      try {

        const response =
          await fetch(
            CATALOG_FUNCTION_URL,
            {
              method: "POST",

              headers: {
                "apikey":
                  SUPABASE_PUBLISHABLE_KEY,

                "Content-Type":
                  "application/json"
              }
            }
          );


        const result =
          await response.json();


        if (!response.ok) {

          throw new Error(
            result.error ||
            "No se pudo cargar el catálogo."
          );

        }


        albums =
          result.albums || [];


        if (albums.length === 0) {

          throw new Error(
            "No se encontraron álbumes."
          );

        }


        renderAlbumSelector();


        /*
          Seleccionamos automáticamente
          el álbum más reciente.
        */

        selectAlbum(0);


      } catch (error) {

        console.error(
          "Error cargando catálogo:",
          error
        );

      }

    }


    /* =====================================================
       SELECTOR DE ÁLBUMES
       ===================================================== */

    function renderAlbumSelector() {

      albumSelect.innerHTML = "";
      customAlbumSelectMenu.innerHTML = "";


      albums.forEach(
        (album, index) => {

          const option =
            document.createElement("option");

          option.value =
            index;

          option.textContent =
            `${album.name} (${album.year})`;

          albumSelect.appendChild(
            option
          );


          const item =
            document.createElement("button");

          item.type =
            "button";

          item.className =
            "custom-select-option";

          item.textContent =
            `${album.name} (${album.year})`;

          item.dataset.index =
            index;

          item.setAttribute(
            "role",
            "option"
          );

          item.addEventListener(
            "click",
            () => {

              selectAlbum(index);
              closeAlbumSelector();

            }
          );

          customAlbumSelectMenu.appendChild(
            item
          );

        }
      );


      updateCustomAlbumSelector();

    }


    function updateCustomAlbumSelector() {

      const album =
        albums[currentAlbumIndex];

      if (!album) {
        return;
      }


      customAlbumSelectButton.textContent =
        `${album.name} (${album.year})`;


      customAlbumSelectMenu
        .querySelectorAll(".custom-select-option")
        .forEach(
          (item) => {

            const active =
              Number(item.dataset.index) ===
              currentAlbumIndex;

            item.classList.toggle(
              "active",
              active
            );

            item.setAttribute(
              "aria-selected",
              active ? "true" : "false"
            );

          }
        );

    }


    function openAlbumSelector() {

      customAlbumSelect.classList.add(
        "open"
      );

      customAlbumSelectButton.setAttribute(
        "aria-expanded",
        "true"
      );

    }


    function closeAlbumSelector() {

      customAlbumSelect.classList.remove(
        "open"
      );

      customAlbumSelectButton.setAttribute(
        "aria-expanded",
        "false"
      );

    }


    customAlbumSelectButton.addEventListener(
      "click",
      (event) => {

        event.stopPropagation();

        if (
          customAlbumSelect.classList.contains(
            "open"
          )
        ) {

          closeAlbumSelector();

        } else {

          openAlbumSelector();

        }

      }
    );


    document.addEventListener(
      "click",
      (event) => {

        if (
          !customAlbumSelect.contains(
            event.target
          )
        ) {

          closeAlbumSelector();

        }

      }
    );



    /* =====================================================
       CAMBIAR DE ÁLBUM
       ===================================================== */

    function selectAlbum(index) {

      currentAlbumIndex =
        Number(index);

      currentSongIndex = 0;


      albumSelect.value =
        currentAlbumIndex;

      updateCustomAlbumSelector();


      const album =
        albums[currentAlbumIndex];


      renderSongList();


      loadCover(
        album.cover
      );


      /*
        Al seleccionar un álbum,
        comenzamos automáticamente
        por la canción 01.
      */

      playSong(0);

    }


    /* =====================================================
       CAMBIO MANUAL DESDE EL SELECT
       ===================================================== */

    albumSelect.addEventListener(
      "change",
      () => {

        selectAlbum(
          Number(
            albumSelect.value
          )
        );

      }
    );


    /* =====================================================
       MOSTRAR LISTA DE CANCIONES
       ===================================================== */

    function renderSongList() {

      songList.innerHTML = "";


      const album =
        albums[currentAlbumIndex];


      album.songs.forEach(
        (song, index) => {

          const element =
            document.createElement("div");


          element.className =
            "song";


          if (
            index === currentSongIndex
          ) {

            element.classList.add(
              "active"
            );

          }


          element.textContent =
            song.name;


          element.addEventListener(
            "click",
            () => {

              playSong(index);

            }
          );


          songList.appendChild(
            element
          );

        }
      );

    }


    /* =====================================================
       OBTENER PORTADA
       ===================================================== */

    async function loadCover(
      coverPath
    ) {

      if (!coverPath) {

        coverImage.removeAttribute(
          "src"
        );

        return;

      }


      try {

        const response =
          await fetch(
            AUDIO_FUNCTION_URL,
            {
              method: "POST",

              headers: {
                "apikey":
                  SUPABASE_PUBLISHABLE_KEY,

                "Content-Type":
                  "application/json"
              },

              body:
                JSON.stringify({
                  path:
                    coverPath
                })
            }
          );


        const result =
          await response.json();


        if (!response.ok) {

          throw new Error(
            result.error ||
            "No se pudo obtener la portada."
          );

        }


        if (!result.signedUrl) {

          throw new Error(
            "Supabase no devolvió una URL firmada para la portada."
          );

        }


        coverImage.src =
          result.signedUrl;


      } catch (error) {

        console.error(
          "Error cargando portada:",
          error
        );


        coverImage.removeAttribute(
          "src"
        );

      }

    }


    /* =====================================================
       REGISTRAR REPRODUCCIÓN
       ===================================================== */

    async function registerPlay(
      album,
      song
    ) {

      try {

        const response =
          await fetch(
            REGISTER_PLAY_FUNCTION_URL,
            {
              method: "POST",

              headers: {
                "apikey":
                  SUPABASE_PUBLISHABLE_KEY,

                "Content-Type":
                  "application/json"
              },

              body:
                JSON.stringify({
                  album:
                    album,

                  song:
                    song
                })
            }
          );


        const result =
          await response.json();


        if (!response.ok) {

          throw new Error(
            result.error ||
            "No se pudo registrar la reproducción."
          );

        }


        console.log(
          "Reproducción registrada:",
          album,
          song
        );


      } catch (error) {

        /*
          Un fallo de estadísticas
          nunca debe detener la música.
        */

        console.error(
          "Error registrando reproducción:",
          error
        );

      }

    }


    /* =====================================================
       REPRODUCIR CANCIÓN
       ===================================================== */

    async function playSong(
      index
    ) {

      const album =
        albums[currentAlbumIndex];


      const song =
        album.songs[index];


      if (!song) {

        return;

      }


      currentSongIndex =
        index;


      songTitle.textContent =
        song.name;


      renderSongList();


      try {

        /*
          Obtener URL firmada
          para el archivo de audio.
        */

        const response =
          await fetch(
            AUDIO_FUNCTION_URL,
            {
              method: "POST",

              headers: {
                "apikey":
                  SUPABASE_PUBLISHABLE_KEY,

                "Content-Type":
                  "application/json"
              },

              body:
                JSON.stringify({
                  path:
                    song.path
                })
            }
          );


        const result =
          await response.json();


        if (!response.ok) {

          throw new Error(
            result.error ||
            "No se pudo obtener el audio."
          );

        }


        if (!result.signedUrl) {

          throw new Error(
            "Supabase no devolvió una URL firmada."
          );

        }


        /*
          Cargar el audio.
        */

        audioPlayer.src =
          result.signedUrl;


        /*
          Intentar comenzar la reproducción.
        */

        await audioPlayer.play();


        /*
          MUY IMPORTANTE:
          solo llegamos aquí si play()
          se ha iniciado correctamente.

          Por tanto, aquí registramos
          la reproducción.
        */

        await registerPlay(
          album.name,
          song.name
        );


      } catch (error) {

        console.error(
          "Error reproduciendo canción:",
          error
        );

      }

    }


    /* =====================================================
       CONTROLES DEL REPRODUCTOR
       ===================================================== */

    function formatPlayerTime(seconds) {

      if (
        !Number.isFinite(seconds) ||
        seconds < 0
      ) {

        return "0:00";

      }


      const minutes =
        Math.floor(seconds / 60);

      const remainingSeconds =
        Math.floor(seconds % 60)
          .toString()
          .padStart(2, "0");

      return `${minutes}:${remainingSeconds}`;

    }


    function updatePlayerTime() {

      const current =
        audioPlayer.currentTime || 0;

      const duration =
        Number.isFinite(audioPlayer.duration)
          ? audioPlayer.duration
          : 0;


      playerProgress.value =
        duration
          ? (current / duration) * 100
          : 0;


      playerTime.textContent =
        `${formatPlayerTime(current)} / ${formatPlayerTime(duration)}`;

    }


    function updatePlayPauseButton() {

      const playing =
        !audioPlayer.paused &&
        !audioPlayer.ended;

      playPauseButton.textContent =
        playing ? "Ⅱ" : "▶";

      playPauseButton.setAttribute(
        "aria-label",
        playing ? "Pausar" : "Reproducir"
      );

      playPauseButton.setAttribute(
        "title",
        playing ? "Pausar" : "Reproducir"
      );

    }


    playPauseButton.addEventListener(
      "click",
      async () => {

        if (!audioPlayer.src) {
          return;
        }


        try {

          if (audioPlayer.paused) {

            await audioPlayer.play();

          } else {

            audioPlayer.pause();

          }

        } catch (error) {

          console.error(
            "Error controlando la reproducción:",
            error
          );

        }

      }
    );


    playerProgress.addEventListener(
      "input",
      () => {

        if (
          Number.isFinite(
            audioPlayer.duration
          )
        ) {

          audioPlayer.currentTime =
            (
              Number(playerProgress.value) /
              100
            ) *
            audioPlayer.duration;

        }

      }
    );


    playerVolume.addEventListener(
      "input",
      () => {

        audioPlayer.volume =
          Number(playerVolume.value);

      }
    );


    audioPlayer.addEventListener(
      "timeupdate",
      updatePlayerTime
    );


    audioPlayer.addEventListener(
      "loadedmetadata",
      updatePlayerTime
    );


    audioPlayer.addEventListener(
      "play",
      updatePlayPauseButton
    );


    audioPlayer.addEventListener(
      "pause",
      updatePlayPauseButton
    );


    audioPlayer.addEventListener(
      "ended",
      updatePlayPauseButton
    );


    audioPlayer.volume =
      Number(playerVolume.value);

    updatePlayerTime();
    updatePlayPauseButton();


    /* =====================================================
       NAVEGACIÓN ANTERIOR / SIGUIENTE
       ===================================================== */

    function playPreviousSong() {

      if (!albums.length) {
        return;
      }

      if (currentSongIndex > 0) {

        playSong(
          currentSongIndex - 1
        );

        return;

      }

      if (currentAlbumIndex > 0) {

        currentAlbumIndex--;

      } else {

        currentAlbumIndex =
          albums.length - 1;

      }

      const album =
        albums[currentAlbumIndex];

      currentSongIndex =
        album.songs.length - 1;

      albumSelect.value =
        currentAlbumIndex;

      renderSongList();

      loadCover(
        album.cover
      );

      playSong(
        currentSongIndex
      );

    }


    function playNextSong() {

      if (!albums.length) {
        return;
      }

      const album =
        albums[currentAlbumIndex];

      if (
        currentSongIndex <
        album.songs.length - 1
      ) {

        playSong(
          currentSongIndex + 1
        );

        return;

      }

      if (currentAlbumIndex <
          albums.length - 1) {

        currentAlbumIndex++;

      } else {

        currentAlbumIndex = 0;

      }

      currentSongIndex = 0;

      albumSelect.value =
        currentAlbumIndex;

      const nextAlbum =
        albums[currentAlbumIndex];

      renderSongList();

      loadCover(
        nextAlbum.cover
      );

      playSong(0);

    }


    previousSongButton.addEventListener(
      "click",
      playPreviousSong
    );


    nextSongButton.addEventListener(
      "click",
      playNextSong
    );


    /* =====================================================
       CUANDO TERMINA UNA CANCIÓN
       ===================================================== */

    audioPlayer.addEventListener(
      "ended",
      () => {

        const album =
          albums[currentAlbumIndex];


        playNextSong();

      }
    );


    /* =====================================================
       CARGAR RECURSOS RRSS
       ===================================================== */

    async function loadRRSS() {

      try {

        const response =
          await fetch(
            RRSS_FUNCTION_URL,
            {
              method: "GET",

              headers: {
                "apikey":
                  SUPABASE_PUBLISHABLE_KEY
              }
            }
          );


        const result =
          await response.json();


        if (!response.ok) {

          throw new Error(
            result.error ||
            "No se pudieron obtener los recursos de RRSS."
          );

        }


        if (!result.lnsLogo) {

          throw new Error(
            "No se recibió la URL del logo LNS."
          );

        }


        if (!result.baalLogo) {

          throw new Error(
            "No se recibió la URL del logo Baal."
          );

        }


        if (!result.qr) {

          throw new Error(
            "No se recibió la URL del QR."
          );

        }


        lnsLogo.src =
          result.lnsLogo;


        baalLogo.src =
          result.baalLogo;


        footerQr.src =
          result.qr;


        if (result.lionsLogo) {

          lionBackground.src =
            result.lionsLogo;

        }


        if (result.linktree) {

          footerQrLink.href =
            result.linktree;

          footerSocialLink.href =
            result.linktree;

        }


        console.log(
          "Recursos de RRSS cargados."
        );


      } catch (error) {

        console.error(
          "Error cargando recursos de RRSS:",
          error
        );

      }

    }


    /* =====================================================
       INICIAR
       ===================================================== */

    registerVisit();

    loadCatalog();

    loadRRSS();


  </script>
