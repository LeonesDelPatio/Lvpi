<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>Leones del Patio</title>


  <style>

    * {
      box-sizing: border-box;
    }


    body {
      margin: 0;
      min-height: 100vh;

      background: #111;

      color: #fff;

      font-family: Arial, sans-serif;
    }


    .player {

      width: min(90%, 700px);

      margin: 60px auto;

    }


    h1 {

      margin: 0 0 35px;

      text-align: center;

      font-size: 30px;

      font-weight: normal;

    }


    /* =====================================================
       SELECTOR DE ÁLBUM
       ===================================================== */

    .album-selector {

      width: 100%;

      margin-bottom: 30px;

    }


    .album-selector label {

      display: block;

      margin-bottom: 8px;

      font-size: 13px;

      color: #aaa;

    }


    select {

      width: 100%;

      padding: 12px;

      background: #1c1c1c;

      color: #fff;

      border: 1px solid #444;

      font-size: 15px;

      cursor: pointer;

    }


    select:focus {

      outline: none;

      border-color: #666;

    }


    /* =====================================================
       PORTADA
       ===================================================== */

    .cover {

      width: min(100%, 450px);

      margin: 0 auto 20px;

      aspect-ratio: 1 / 1;

      background: #1c1c1c;

      overflow: hidden;

    }


    .cover img {

      width: 100%;

      height: 100%;

      display: block;

      object-fit: cover;

    }


    /* =====================================================
       BLOQUE DEL REPRODUCTOR
       ===================================================== */

    .player-box {

      width: 100%;

      margin-bottom: 25px;

    }


    /* =====================================================
       TÍTULO DE LA CANCIÓN
       ===================================================== */

    .now-playing {

      margin-bottom: 10px;

      padding: 0 10px;

      text-align: center;

      font-size: 15px;

      line-height: 1.4;

      color: #ddd;

      white-space: nowrap;

      overflow: hidden;

      text-overflow: ellipsis;

    }


    .now-playing-label {

      color: #777;

      margin-right: 5px;

    }


    audio {

      width: 100%;

      display: block;

    }


    /* =====================================================
       NOMBRE DEL ÁLBUM
       ===================================================== */

    .album-name {

      text-align: center;

      font-size: 20px;

      margin-bottom: 25px;

    }


    /* =====================================================
       LISTA DE CANCIONES
       ===================================================== */

    .songs {

      margin-bottom: 30px;

    }


    .song {

      padding: 11px 12px;

      border-bottom: 1px solid #292929;

      cursor: pointer;

      font-size: 14px;

      transition:
        background 0.15s ease;

    }


    .song:hover {

      background: #1c1c1c;

    }


    .song.active {

      background: #242424;

    }

  </style>

</head>


<body>


  <main class="player">


    <h1>
      Leones del Patio
    </h1>


    <!-- ===================================================
         SELECTOR DE ÁLBUM
         =================================================== -->

    <div class="album-selector">

      <label for="albumSelect">
        Álbum
      </label>


      <select id="albumSelect">

        <option>
          Cargando discos...
        </option>

      </select>

    </div>


    <!-- ===================================================
         PORTADA
         =================================================== -->

    <div class="cover">

      <img
        id="coverImage"
        src=""
        alt="Portada del álbum">

    </div>


    <!-- ===================================================
         REPRODUCTOR
         =================================================== -->

    <div class="player-box">


      <!-- TÍTULO DE LA CANCIÓN -->

      <div
        id="nowPlaying"
        class="now-playing">

        <span
          class="now-playing-label">
          Reproduciendo
        </span>

        <span id="songTitle">
          Ninguna canción
        </span>

      </div>


      <!-- AUDIO -->

      <audio
        id="audioPlayer"
        controls
        preload="metadata"
        controlslist="nodownload noremoteplayback"
        noremoteplayback>
      </audio>


    </div>


    <!-- ===================================================
         NOMBRE DEL ÁLBUM
         =================================================== -->

    <div
      id="albumName"
      class="album-name">
    </div>


    <!-- ===================================================
         LISTA DE CANCIONES
         =================================================== -->

    <div
      id="songs"
      class="songs">
    </div>


  </main>


  <script>


    /* =====================================================
       CONFIGURACIÓN
       ===================================================== */


    const SUPABASE_URL =
      "https://cavnifartuktwmchyrdl.supabase.co";


    /*
      IMPORTANTE:

      Introduce aquí exactamente la misma
      PUBLISHABLE KEY que ya estabas utilizando.
    */


    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_WC_7KWhh6gq-pvL-97D3VA_78DyHmOM";


    const CATALOG_FUNCTION_URL =
      `${SUPABASE_URL}/functions/v1/get-catalog`;


    const AUDIO_FUNCTION_URL =
      `${SUPABASE_URL}/functions/v1/get-audio-url`;


    /* =====================================================
       ELEMENTOS DE LA INTERFAZ
       ===================================================== */


    const albumSelect =
      document.getElementById(
        "albumSelect"
      );


    const coverImage =
      document.getElementById(
        "coverImage"
      );


    const albumName =
      document.getElementById(
        "albumName"
      );


    const songsContainer =
      document.getElementById(
        "songs"
      );


    const audioPlayer =
      document.getElementById(
        "audioPlayer"
      );


    const songTitle =
      document.getElementById(
        "songTitle"
      );


    /* =====================================================
       VARIABLES
       ===================================================== */


    let catalog = null;


    let currentAlbumIndex = 0;


    let currentSongIndex = 0;


    /* =====================================================
       CARGAR CATÁLOGO
       ===================================================== */


    async function loadCatalog() {


      try {


        const response =
          await fetch(
            CATALOG_FUNCTION_URL,
            {

              method: "POST",

              headers: {

                "apikey":
                  SUPABASE_PUBLISHABLE_KEY,

                "Content-Type":
                  "application/json"

              },

              body:
                JSON.stringify({})

            }
          );


        const result =
          await response.json();


        if (!response.ok) {

          throw new Error(
            result.error ||
            "No se pudo cargar el catálogo."
          );

        }


        if (
          !result.albums ||
          !Array.isArray(result.albums) ||
          result.albums.length === 0
        ) {

          throw new Error(
            "No se encontraron discos."
          );

        }


        catalog =
          result;


        buildAlbumSelector();


        /*
          El catálogo ya viene ordenado por
          año y orden desde get-catalog.

          Por tanto, 0 = álbum más reciente.
        */


        selectAlbum(0);

      }


      catch (error) {


        console.error(
          "Error cargando catálogo:",
          error
        );

      }

    }


    /* =====================================================
       CREAR SELECTOR DE ÁLBUMES
       ===================================================== */


    function buildAlbumSelector() {


      albumSelect.innerHTML =
        "";


      catalog.albums.forEach(
        (album, index) => {


          const option =
            document.createElement(
              "option"
            );


          option.value =
            index;


          /*
            El nombre recibido por get-catalog
            ya tiene oculto el último (01), (02), etc.

            El año sí permanece visible.
          */


          option.textContent =
            `${album.name} (${album.year})`;


          albumSelect.appendChild(
            option
          );

        }
      );

    }


    /* =====================================================
       SELECCIONAR ÁLBUM
       ===================================================== */


    function selectAlbum(index) {


      currentAlbumIndex =
        index;


      currentSongIndex =
        0;


      const album =
        catalog.albums[
          currentAlbumIndex
        ];


      albumSelect.value =
        currentAlbumIndex;


      albumName.textContent =
        `${album.name} (${album.year})`;


      /*
        Cargamos la portada privada.
      */


      loadCover(
        album.cover
      );


      /*
        Construimos la lista.
      */


      buildSongList();


      /*
        Al seleccionar un álbum,
        comenzamos automáticamente
        por la pista 01.
      */


      playSong(0);

    }


    /* =====================================================
       CARGAR PORTADA PRIVADA
       ===================================================== */


    async function loadCover(
      coverPath
    ) {


      /*
        Si por alguna razón el álbum no
        tiene portada, dejamos el espacio
        vacío.
      */


      if (!coverPath) {

        coverImage.removeAttribute(
          "src"
        );

        return;

      }


      try {


        /*
          Utilizamos la misma Edge Function
          que utilizamos para el audio.

          La función genera una URL firmada
          temporal para cualquier archivo
          existente en musicpriv.
        */


        const response =
          await fetch(
            AUDIO_FUNCTION_URL,
            {

              method: "POST",

              headers: {

                "apikey":
                  SUPABASE_PUBLISHABLE_KEY,

                "Content-Type":
                  "application/json"

              },

              body:
                JSON.stringify({

                  path:
                    coverPath

                })

            }
          );


        const result =
          await response.json();


        if (!response.ok) {

          throw new Error(
            result.error ||
            "No se pudo obtener la portada."
          );

        }


        if (!result.signedUrl) {

          throw new Error(
            "Supabase no devolvió una URL firmada para la portada."
          );

        }


        /*
          La URL firmada se coloca
          directamente en la imagen.
        */


        coverImage.src =
          result.signedUrl;


      }


      catch (error) {


        console.error(
          "Error cargando portada:",
          error
        );


        coverImage.removeAttribute(
          "src"
        );

      }

    }


    /* =====================================================
       CREAR LISTA DE CANCIONES
       ===================================================== */


    function buildSongList() {


      songsContainer.innerHTML =
        "";


      const album =
        catalog.albums[
          currentAlbumIndex
        ];


      album.songs.forEach(
        (song, index) => {


          const element =
            document.createElement(
              "div"
            );


          element.className =
            "song";


          element.textContent =
            song.name;


          element.addEventListener(
            "click",
            () => {

              playSong(index);

            }
          );


          songsContainer.appendChild(
            element
          );

        }
      );


      updateActiveSong();

    }


    /* =====================================================
       REPRODUCIR CANCIÓN
       ===================================================== */


    async function playSong(index) {


      const album =
        catalog.albums[
          currentAlbumIndex
        ];


      const song =
        album.songs[index];


      currentSongIndex =
        index;


      try {


        /*
          Actualizamos inmediatamente
          el título visible.
        */


        songTitle.textContent =
          song.name;


        /*
          Pedimos a Supabase una URL
          firmada temporalmente.
        */


        const response =
          await fetch(
            AUDIO_FUNCTION_URL,
            {

              method: "POST",

              headers: {

                "apikey":
                  SUPABASE_PUBLISHABLE_KEY,

                "Content-Type":
                  "application/json"

              },

              body:
                JSON.stringify({

                  path:
                    song.path

                })

            }
          );


        const result =
          await response.json();


        if (!response.ok) {

          throw new Error(
            result.error ||
            "No se pudo obtener el audio."
          );

        }


        if (!result.signedUrl) {

          throw new Error(
            "Supabase no devolvió una URL firmada."
          );

        }


        /*
          Ponemos la URL temporal
          en el reproductor.
        */


        audioPlayer.src =
          result.signedUrl;


        updateActiveSong();


        /*
          Intentamos comenzar
          automáticamente.
        */


        try {


          await audioPlayer.play();


        }


        catch (playError) {


          /*
            El navegador puede bloquear
            la reproducción iniciada por
            JavaScript.

            No mostramos ningún mensaje
            adicional en la página.
          */


          console.warn(
            "Reproducción automática bloqueada:",
            playError
          );

        }


      }


      catch (error) {


        console.error(
          "Error reproduciendo canción:",
          error
        );

      }

    }


    /* =====================================================
       MARCAR CANCIÓN ACTIVA
       ===================================================== */


    function updateActiveSong() {


      const songs =
        document.querySelectorAll(
          ".song"
        );


      songs.forEach(
        (element, index) => {


          element.classList.toggle(
            "active",
            index === currentSongIndex
          );


        }
      );

    }


    /* =====================================================
       CAMBIO MANUAL DE ÁLBUM
       ===================================================== */


    albumSelect.addEventListener(
      "change",
      () => {


        const index =
          Number(
            albumSelect.value
          );


        selectAlbum(index);

      }
    );


    /* =====================================================
       REPRODUCCIÓN AUTOMÁTICA SECUENCIAL
       ===================================================== */


    audioPlayer.addEventListener(
      "ended",
      () => {


        const album =
          catalog.albums[
            currentAlbumIndex
          ];


        /*
          ---------------------------------------------------
          CASO 1:
          Hay otra canción en el álbum.
          ---------------------------------------------------
        */


        if (
          currentSongIndex <
          album.songs.length - 1
        ) {


          playSong(
            currentSongIndex + 1
          );


          return;

        }


        /*
          ---------------------------------------------------
          CASO 2:
          Última canción del álbum.

          Pasamos al siguiente álbum.
          ---------------------------------------------------
        */


        if (
          currentAlbumIndex <
          catalog.albums.length - 1
        ) {


          currentAlbumIndex++;


          currentSongIndex =
            0;


          const nextAlbum =
            catalog.albums[
              currentAlbumIndex
            ];


          albumSelect.value =
            currentAlbumIndex;


          albumName.textContent =
            `${nextAlbum.name} (${nextAlbum.year})`;


          loadCover(
            nextAlbum.cover
          );


          buildSongList();


          playSong(0);


          return;

        }


        /*
          ---------------------------------------------------
          CASO 3:
          Última canción del último álbum.

          Volvemos al álbum más reciente.
          ---------------------------------------------------
        */


        currentAlbumIndex =
          0;


        currentSongIndex =
          0;


        const firstAlbum =
          catalog.albums[
            currentAlbumIndex
          ];


        albumSelect.value =
          currentAlbumIndex;


        albumName.textContent =
          `${firstAlbum.name} (${firstAlbum.year})`;


        loadCover(
          firstAlbum.cover
        );


        buildSongList();


        playSong(0);

      }
    );


    /* =====================================================
       INICIAR
       ===================================================== */


    loadCatalog();


  </script>


</body>

</html>
