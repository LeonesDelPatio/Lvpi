<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Lvpi</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #111;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }

    .container {
      width: min(900px, 92%);
      margin: 0 auto;
      padding: 40px 0 60px;
      text-align: center;
    }

    h1 {
      margin: 0 0 30px;
      font-size: 28px;
      font-weight: 500;
    }

    .album-selector {
      margin-bottom: 30px;
    }

    select {
      width: 100%;
      max-width: 600px;
      padding: 12px 14px;
      background: #1d1d1d;
      color: #fff;
      border: 1px solid #444;
      border-radius: 6px;
      font-size: 15px;
      cursor: pointer;
    }

    .cover-container {
      width: min(500px, 90%);
      margin: 0 auto 25px;
    }

    .cover-container img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 4px;
    }

    audio {
      width: min(700px, 100%);
      margin: 0 auto 25px;
      display: block;
    }

    .now-playing {
      margin: 10px auto 30px;
      text-align: center;
      max-width: 750px;
    }

    .now-playing-label {
      display: block;
      margin-bottom: 7px;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #888;
    }

    #songTitle {
      display: block;
      font-size: 17px;
      line-height: 1.5;
      color: #fff;
    }

    .songs {
      width: min(750px, 100%);
      margin: 0 auto;
      text-align: left;
    }

    .song {
      padding: 12px 14px;
      border-bottom: 1px solid #2a2a2a;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .song:hover {
      background: #1b1b1b;
    }

    .song.active {
      background: #222;
    }


    /* =====================================================
       FOOTER
       ===================================================== */

    .site-footer {
      width: 100%;
      margin-top: 55px;
      padding: 70px 20px 24px;
      border-top: 1px solid #242424;
      text-align: center;
    }

    .footer-content {
      width: min(900px, 100%);
      margin: 0 auto;
    }

    .footer-logos {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 95px;
      min-height: 120px;
      margin: 0 auto 55px;
      padding: 0 20px;
    }

    .footer-logo {
      display: block;
      width: auto;
      height: 88px;
      max-width: 310px;
      object-fit: contain;
      opacity: 0.58;
      user-select: none;
      -webkit-user-select: none;
      -webkit-user-drag: none;
      pointer-events: auto;
      transition:
        opacity 0.25s ease,
        transform 0.25s ease;
    }

    .footer-logo:hover {
      opacity: 0.95;
      transform: scale(1.035);
    }

    .footer-qr-link {
      display: block;
      width: fit-content;
      margin: 0 auto;
      line-height: 0;
      text-decoration: none;
    }

    .footer-qr {
      display: block;
      width: 155px;
      height: 155px;
      margin: 0 auto;
      object-fit: contain;
      user-select: none;
      -webkit-user-select: none;
      -webkit-user-drag: none;
    }

    .footer-social-link {
      display: inline-block;
      margin-top: 18px;
      color: #999;
      font-size: 12px;
      letter-spacing: 1.4px;
      text-decoration: none;
      transition:
        color 0.2s ease;
    }

    .footer-social-link:hover {
      color: #fff;
    }

    .footer-copyright {
      width: min(900px, 100%);
      margin: 52px auto 0;
      color: #555;
      font-size: 10px;
      line-height: 1.4;
      text-align: right;
    }


    /* =====================================================
       RESPONSIVE
       ===================================================== */

    @media (max-width: 600px) {

      .container {
        padding-top: 25px;
      }

      h1 {
        font-size: 24px;
      }

      #songTitle {
        font-size: 15px;
      }

      .song {
        padding: 11px 10px;
      }

      .site-footer {
        margin-top: 40px;
        padding-top: 55px;
        padding-bottom: 18px;
      }

      .footer-logos {
        gap: 42px;
        min-height: 78px;
        margin-bottom: 40px;
        padding: 0 10px;
      }

      .footer-logo {
        height: 62px;
        max-width: 43%;
      }

      .footer-logo:hover {
        transform: scale(1.025);
      }

      .footer-qr {
        width: 125px;
        height: 125px;
      }

      .footer-social-link {
        margin-top: 15px;
      }

      .footer-copyright {
        margin-top: 42px;
        text-align: center;
        font-size: 9px;
      }

    }


    @media (max-width: 400px) {

      .footer-logos {
        gap: 28px;
      }

      .footer-logo {
        height: 55px;
      }

      .footer-qr {
        width: 115px;
        height: 115px;
      }

    }

  </style>
</head>

<body>

  <div class="container">

    <h1>Lvpi</h1>

    <div class="album-selector">
      <select id="albumSelect"></select>
    </div>

    <div class="cover-container">
      <img
        id="coverImage"
        alt="Portada del álbum"
      >
    </div>

    <audio
      id="audioPlayer"
      controls
      controlslist="nodownload noremoteplayback"
      noremoteplayback
      preload="metadata"
    ></audio>

    <div class="now-playing">

      <span class="now-playing-label">
        Reproduciendo
      </span>

      <span id="songTitle">
        Ninguna canción
      </span>

    </div>

    <div
      id="songList"
      class="songs"
    ></div>

  </div>


  <footer class="site-footer">

    <div class="footer-content">

      <div class="footer-logos">

        <img
          id="lnsLogo"
          class="footer-logo"
          alt="Leones del Patio"
          draggable="false"
        >

        <img
          id="baalLogo"
          class="footer-logo"
          alt="Baal"
          draggable="false"
        >

      </div>

      <a
        id="footerQrLink"
        class="footer-qr-link"
        href="https://linktr.ee/LvpiAKAJohnOPerdono"
        target="_blank"
        rel="noopener noreferrer"
      >
        <img
          id="footerQr"
          class="footer-qr"
          alt="QR para redes sociales"
          draggable="false"
        >
      </a>

      <a
        id="footerSocialLink"
        class="footer-social-link"
        href="https://linktr.ee/LvpiAKAJohnOPerdono"
        target="_blank"
        rel="noopener noreferrer"
      >
        Click para RRSS
      </a>

    </div>

    <div class="footer-copyright">
      © Todos los derechos reservados para Lvpi y Leones del Patio
    </div>

  </footer>


  <script>

    /* =====================================================
       CONFIGURACIÓN SUPABASE
       ===================================================== */

    const SUPABASE_URL =
      "https://cavnifartuktwmchyrdl.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_WC_7KWhh6gq-pvL-97D3VA_78DyHmOM";


    const CATALOG_FUNCTION_URL =
      `${SUPABASE_URL}/functions/v1/get-catalog`;

    const AUDIO_FUNCTION_URL =
      `${SUPABASE_URL}/functions/v1/get-audio-url`;

    const REGISTER_PLAY_FUNCTION_URL =
      `${SUPABASE_URL}/functions/v1/register-play`;

    const REGISTER_VISIT_FUNCTION_URL =
      `${SUPABASE_URL}/functions/v1/register-visit`;

    const RRSS_FUNCTION_URL =
      `${SUPABASE_URL}/functions/v1/get-rrss`;


    /* =====================================================
       ELEMENTOS HTML
       ===================================================== */

    const albumSelect =
      document.getElementById("albumSelect");

    const coverImage =
      document.getElementById("coverImage");

    const audioPlayer =
      document.getElementById("audioPlayer");

    const songTitle =
      document.getElementById("songTitle");

    const songList =
      document.getElementById("songList");

    const lnsLogo =
      document.getElementById("lnsLogo");

    const baalLogo =
      document.getElementById("baalLogo");

    const footerQr =
      document.getElementById("footerQr");

    const footerQrLink =
      document.getElementById("footerQrLink");

    const footerSocialLink =
      document.getElementById("footerSocialLink");


    /* =====================================================
       VARIABLES
       ===================================================== */

    let albums = [];

    let currentAlbumIndex = 0;

    let currentSongIndex = 0;


    /* =====================================================
       REGISTRAR VISITA
       ===================================================== */

    async function registerVisit() {

      try {

        const response =
          await fetch(
            REGISTER_VISIT_FUNCTION_URL,
            {
              method: "POST",

              headers: {
                "apikey":
                  SUPABASE_PUBLISHABLE_KEY,

                "Content-Type":
                  "application/json"
              },

              body:
                JSON.stringify({})
            }
          );


        const result =
          await response.json();


        if (!response.ok) {

          throw new Error(
            result.error ||
            "No se pudo registrar la visita."
          );

        }


        console.log(
          "Visita registrada."
        );


      } catch (error) {

        /*
          Un fallo de estadísticas
          nunca debe impedir que
          la web continúe cargando.
        */

        console.error(
          "Error registrando visita:",
          error
        );

      }

    }


    /* =====================================================
       OBTENER CATÁLOGO
       ===================================================== */

    async function loadCatalog() {

      try {

        const response =
          await fetch(
            CATALOG_FUNCTION_URL,
            {
              method: "POST",

              headers: {
                "apikey":
                  SUPABASE_PUBLISHABLE_KEY,

                "Content-Type":
                  "application/json"
              }
            }
          );


        const result =
          await response.json();


        if (!response.ok) {

          throw new Error(
            result.error ||
            "No se pudo cargar el catálogo."
          );

        }


        albums =
          result.albums || [];


        if (albums.length === 0) {

          throw new Error(
            "No se encontraron álbumes."
          );

        }


        renderAlbumSelector();


        /*
          Seleccionamos automáticamente
          el álbum más reciente.
        */

        selectAlbum(0);


      } catch (error) {

        console.error(
          "Error cargando catálogo:",
          error
        );

      }

    }


    /* =====================================================
       SELECTOR DE ÁLBUMES
       ===================================================== */

    function renderAlbumSelector() {

      albumSelect.innerHTML = "";


      albums.forEach(
        (album, index) => {

          const option =
            document.createElement("option");

          option.value =
            index;

          option.textContent =
            `${album.name} (${album.year})`;

          albumSelect.appendChild(
            option
          );

        }
      );

    }


    /* =====================================================
       CAMBIAR DE ÁLBUM
       ===================================================== */

    function selectAlbum(index) {

      currentAlbumIndex =
        Number(index);

      currentSongIndex = 0;


      albumSelect.value =
        currentAlbumIndex;


      const album =
        albums[currentAlbumIndex];


      renderSongList();


      loadCover(
        album.cover
      );


      /*
        Al seleccionar un álbum,
        comenzamos automáticamente
        por la canción 01.
      */

      playSong(0);

    }


    /* =====================================================
       CAMBIO MANUAL DESDE EL SELECT
       ===================================================== */

    albumSelect.addEventListener(
      "change",
      () => {

        selectAlbum(
          Number(
            albumSelect.value
          )
        );

      }
    );


    /* =====================================================
       MOSTRAR LISTA DE CANCIONES
       ===================================================== */

    function renderSongList() {

      songList.innerHTML = "";


      const album =
        albums[currentAlbumIndex];


      album.songs.forEach(
        (song, index) => {

          const element =
            document.createElement("div");


          element.className =
            "song";


          if (
            index === currentSongIndex
          ) {

            element.classList.add(
              "active"
            );

          }


          element.textContent =
            song.name;


          element.addEventListener(
            "click",
            () => {

              playSong(index);

            }
          );


          songList.appendChild(
            element
          );

        }
      );

    }


    /* =====================================================
       OBTENER PORTADA
       ===================================================== */

    async function loadCover(
      coverPath
    ) {

      if (!coverPath) {

        coverImage.removeAttribute(
          "src"
        );

        return;

      }


      try {

        const response =
          await fetch(
            AUDIO_FUNCTION_URL,
            {
              method: "POST",

              headers: {
                "apikey":
                  SUPABASE_PUBLISHABLE_KEY,

                "Content-Type":
                  "application/json"
              },

              body:
                JSON.stringify({
                  path:
                    coverPath
                })
            }
          );


        const result =
          await response.json();


        if (!response.ok) {

          throw new Error(
            result.error ||
            "No se pudo obtener la portada."
          );

        }


        if (!result.signedUrl) {

          throw new Error(
            "Supabase no devolvió una URL firmada para la portada."
          );

        }


        coverImage.src =
          result.signedUrl;


      } catch (error) {

        console.error(
          "Error cargando portada:",
          error
        );


        coverImage.removeAttribute(
          "src"
        );

      }

    }


    /* =====================================================
       REGISTRAR REPRODUCCIÓN
       ===================================================== */

    async function registerPlay(
      album,
      song
    ) {

      try {

        const response =
          await fetch(
            REGISTER_PLAY_FUNCTION_URL,
            {
              method: "POST",

              headers: {
                "apikey":
                  SUPABASE_PUBLISHABLE_KEY,

                "Content-Type":
                  "application/json"
              },

              body:
                JSON.stringify({
                  album:
                    album,

                  song:
                    song
                })
            }
          );


        const result =
          await response.json();


        if (!response.ok) {

          throw new Error(
            result.error ||
            "No se pudo registrar la reproducción."
          );

        }


        console.log(
          "Reproducción registrada:",
          album,
          song
        );


      } catch (error) {

        /*
          Un fallo de estadísticas
          nunca debe detener la música.
        */

        console.error(
          "Error registrando reproducción:",
          error
        );

      }

    }


    /* =====================================================
       REPRODUCIR CANCIÓN
       ===================================================== */

    async function playSong(
      index
    ) {

      const album =
        albums[currentAlbumIndex];


      const song =
        album.songs[index];


      if (!song) {

        return;

      }


      currentSongIndex =
        index;


      songTitle.textContent =
        song.name;


      renderSongList();


      try {

        /*
          Obtener URL firmada
          para el archivo de audio.
        */

        const response =
          await fetch(
            AUDIO_FUNCTION_URL,
            {
              method: "POST",

              headers: {
                "apikey":
                  SUPABASE_PUBLISHABLE_KEY,

                "Content-Type":
                  "application/json"
              },

              body:
                JSON.stringify({
                  path:
                    song.path
                })
            }
          );


        const result =
          await response.json();


        if (!response.ok) {

          throw new Error(
            result.error ||
            "No se pudo obtener el audio."
          );

        }


        if (!result.signedUrl) {

          throw new Error(
            "Supabase no devolvió una URL firmada."
          );

        }


        /*
          Cargar el audio.
        */

        audioPlayer.src =
          result.signedUrl;


        /*
          Intentar comenzar la reproducción.
        */

        await audioPlayer.play();


        /*
          MUY IMPORTANTE:
          solo llegamos aquí si play()
          se ha iniciado correctamente.

          Por tanto, aquí registramos
          la reproducción.
        */

        await registerPlay(
          album.name,
          song.name
        );


      } catch (error) {

        console.error(
          "Error reproduciendo canción:",
          error
        );

      }

    }


    /* =====================================================
       CUANDO TERMINA UNA CANCIÓN
       ===================================================== */

    audioPlayer.addEventListener(
      "ended",
      () => {

        const album =
          albums[currentAlbumIndex];


        /*
          Todavía quedan canciones
          dentro del álbum.
        */

        if (
          currentSongIndex <
          album.songs.length - 1
        ) {

          playSong(
            currentSongIndex + 1
          );

          return;

        }


        /*
          Última canción del álbum.
          Pasamos al siguiente álbum.
        */

        if (
          currentAlbumIndex <
          albums.length - 1
        ) {

          currentAlbumIndex++;


          currentSongIndex = 0;


          albumSelect.value =
            currentAlbumIndex;


          const nextAlbum =
            albums[currentAlbumIndex];


          renderSongList();


          loadCover(
            nextAlbum.cover
          );


          playSong(0);


          return;

        }


        /*
          Hemos terminado el último
          álbum del catálogo.

          Volvemos al primero.
        */

        currentAlbumIndex = 0;

        currentSongIndex = 0;


        albumSelect.value =
          currentAlbumIndex;


        const firstAlbum =
          albums[0];


        renderSongList();


        loadCover(
          firstAlbum.cover
        );


        playSong(0);

      }
    );


    /* =====================================================
       CARGAR RECURSOS RRSS
       ===================================================== */

    async function loadRRSS() {

      try {

        const response =
          await fetch(
            RRSS_FUNCTION_URL,
            {
              method: "GET",

              headers: {
                "apikey":
                  SUPABASE_PUBLISHABLE_KEY
              }
            }
          );


        const result =
          await response.json();


        if (!response.ok) {

          throw new Error(
            result.error ||
            "No se pudieron obtener los recursos de RRSS."
          );

        }


        if (!result.lnsLogo) {

          throw new Error(
            "No se recibió la URL del logo LNS."
          );

        }


        if (!result.baalLogo) {

          throw new Error(
            "No se recibió la URL del logo Baal."
          );

        }


        if (!result.qr) {

          throw new Error(
            "No se recibió la URL del QR."
          );

        }


        lnsLogo.src =
          result.lnsLogo;


        baalLogo.src =
          result.baalLogo;


        footerQr.src =
          result.qr;


        if (result.linktree) {

          footerQrLink.href =
            result.linktree;

          footerSocialLink.href =
            result.linktree;

        }


        console.log(
          "Recursos de RRSS cargados."
        );


      } catch (error) {

        console.error(
          "Error cargando recursos de RRSS:",
          error
        );

      }

    }


    /* =====================================================
       INICIAR
       ===================================================== */

    registerVisit();

    loadCatalog();

    loadRRSS();

  </script>

</body>
</html>
```
